name: ALIGN
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
# Separate Release-optimized and Preview builds. The official Release uses ALIGN 1.0.
configs:
  Debug: debug
  Release: release
  PreviewRelease: release
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  ALIGN:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.com.alignmembers.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ALIGN
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "5"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2WG8DN922L
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: mx.com.alignmembers.app.preview
          INFOPLIST_KEY_CFBundleDisplayName: ALIGN Preview
        Release:
          MARKETING_VERSION: "1.0"
          CURRENT_PROJECT_VERSION: "9"
        PreviewRelease:
          PRODUCT_BUNDLE_IDENTIFIER: mx.com.alignmembers.app.preview
          INFOPLIST_KEY_CFBundleDisplayName: ALIGN Preview
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ALIGN_PREVIEW
          CURRENT_PROJECT_VERSION: "9"

# Choose scheme ALIGN (archive Release) for the official App Store build.
# Choose ALIGN Private TestFlight only for the isolated Preview app.
schemes:
  ALIGN:
    build:
      targets:
        ALIGN: all
    run:
      config: Debug
    archive:
      config: Release
  ALIGN Private TestFlight:
    build:
      targets:
        ALIGN: all
    run:
      config: PreviewRelease
    archive:
      config: PreviewRelease
