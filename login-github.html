<!doctype html><html lang="es-MX"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#090a0c"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Log in | ALIGN GitHub</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><style>:root{--ink:#090a0c;--paper:#f5f2ec;--muted:#aaa59c;--line:rgba(245,242,236,.18)}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 12%,#1c2939 0,#090a0c 54%);color:var(--paper);font-family:"DM Sans",sans-serif}.shell{width:min(100%,460px)}.brand{display:block;margin-bottom:28px;text-align:center;color:inherit;text-decoration:none;font-family:"Playfair Display",serif;font-size:1.35rem;letter-spacing:.2em}.panel{padding:42px 36px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(23,42,69,.96),rgba(7,11,16,.98));box-shadow:0 28px 80px rgba(0,0,0,.42)}.eyebrow{margin:0 0 14px;font:500 .67rem "DM Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}h1{margin:0;font:500 clamp(2.6rem,10vw,4.4rem)/.95 "Playfair Display",serif;letter-spacing:-.045em}.copy{margin:18px 0 30px;color:#cbc7be;line-height:1.6}label{display:block;margin:18px 0 8px;font:500 .67rem "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:#d9d4cb}input{width:100%;padding:15px 14px;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.24);color:#fff;font:500 1rem "DM Mono",monospace;outline:none}input:focus{border-color:#fff}.button{width:100%;margin-top:24px;padding:15px;border:1px solid #fff;background:#fff;color:#090a0c;font-weight:600;letter-spacing:.11em;text-transform:uppercase;cursor:pointer}.error{min-height:22px;margin:14px 0 0;color:#ffd0d0;font-size:.84rem}.hint{margin:22px 0 0;color:#99958d;font-size:.76rem;line-height:1.5;text-align:center}.back{display:block;margin-top:22px;text-align:center;color:#bdb8af;text-decoration:none;font:500 .67rem "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase}@media(max-width:520px){.panel{padding:34px 24px}}</style></head><body><main class="shell"><a class="brand" href="./">ALIGN</a><section class="panel"><p class="eyebrow">Acceso de miembros</p><h1>Tu ciudad, desde dentro.</h1><p class="copy">Ingresa con el usuario y contraseña que creaste al contratar tu membresía.</p><form id="login-form"><label for="username">Nombre de usuario</label><input id="username" name="username" autocomplete="username" placeholder="Tu usuario ALIGN" required maxlength="24"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Contraseña" required><button class="button" type="submit">Entrar a mi portal</button><p id="error" class="error" role="alert"></p></form><p class="hint">Las credenciales pertenecen al titular de la membresía.</p></section><a class="back" href="./">← Volver a ALIGN</a></main><script>const form=document.querySelector('#login-form'),error=document.querySelector('#error'),button=form.querySelector('button');const hashPassword=async value=>{const bytes=new TextEncoder().encode(value),digest=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('')};form.addEventListener('submit',async event=>{event.preventDefault();error.textContent='';button.disabled=true;button.textContent='Entrando…';try{const username=form.username.value.trim().toLowerCase(),password=form.password.value;if(username==='mytime'&&password.toUpperCase()==='MYTIME'){sessionStorage.setItem('align_member_token','MYTIME');sessionStorage.setItem('align_master_access','1');location.replace(`mi-membresia.html?token=MYTIME&master=1&v=${Date.now()}`);return}if(location.hostname==='edgartikis.github.io'){const group=JSON.parse(localStorage.getItem('align_demo_group')||'null'),hash=await hashPassword(password);if(group?.account?.username!==username||group.account.passwordHash!==hash)throw new Error('Usuario o contraseña incorrectos en este dispositivo.');const member=group.primary;if(!member)throw new Error('La membresía no está disponible.');sessionStorage.setItem('align_member_token',member.token);sessionStorage.removeItem('align_master_access');location.replace(`mi-membresia.html?token=${encodeURIComponent(member.token)}&demo=1&v=${Date.now()}`);return}const response=await fetch('/.netlify/functions/member-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username,password})}),data=await response.json();if(!response.ok||!data.token)throw new Error(data.error||'Usuario o contraseña incorrectos.');sessionStorage.setItem('align_member_token',data.token);sessionStorage.removeItem('align_master_access');location.replace(`mi-membresia.html?token=${encodeURIComponent(data.token)}&v=${Date.now()}`)}catch(err){error.textContent=err.message;button.disabled=false;button.textContent='Entrar a mi portal'}});</script></body></html>
