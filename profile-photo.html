<!doctype html><html lang="es-MX"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0d12"><title>Tu foto de perfil | ALIGN</title><style>
*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#1d3554,#090a0c 52%);color:#f5f2ec;font-family:Arial,sans-serif}.panel{width:min(100%,520px);padding:34px;border:1px solid rgba(255,255,255,.18);background:rgba(9,12,17,.92);box-shadow:0 30px 80px rgba(0,0,0,.45)}.logo{display:block;width:min(150px,40vw);height:auto;margin:0 auto 22px;object-fit:contain}h1{margin:0;text-align:center;font:400 clamp(34px,8vw,52px)/1 Georgia,serif}p{color:#bfc3ca;line-height:1.55;text-align:center}.camera{position:relative;width:min(100%,360px);aspect-ratio:1;margin:26px auto 18px;overflow:hidden;border-radius:50%;border:3px solid #d9c6a5;background:#111923}.camera video,.camera img{width:100%;height:100%;object-fit:cover}.camera video{transform:scaleX(-1)}.camera img{display:none}.actions{display:grid;gap:10px}.button{width:100%;padding:14px;border:1px solid #fff;background:#fff;color:#090a0c;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.secondary{background:transparent;color:#fff}.note{font-size:.77rem;color:#858a92}.error{min-height:22px;color:#efb9b9;text-align:center;font-size:.85rem}.hidden{display:none}.fallback-note{margin:4px 0 0;font-size:.72rem;color:#8e949d}
</style><link rel="icon" type="image/png" href="assets/align-primary.png?v=transparent-5"></head><body><main class="panel"><img class="logo" src="image-gen-1(20260816-192750).png?v=20260816-192750" alt="ALIGN"><h1>Esta cuenta es tuya.</h1><p>Tómate una foto clara de frente. Se usará para identificarte cuando presentes tu QR.</p><div class="camera"><video id="video" autoplay playsinline muted></video><img id="preview" alt="Vista previa de tu foto"></div><canvas id="canvas" width="320" height="320" class="hidden"></canvas><input id="cameraInput" class="hidden" type="file" accept="image/*" capture="user"><div class="actions"><button id="capture" class="button">Tomar foto</button><button id="openCamera" class="button secondary hidden">Abrir cámara del iPhone</button><button id="retake" class="button secondary hidden">Volver a tomar</button><button id="save" class="button hidden">Guardar y abrir tarjeta</button></div><div id="error" class="error"></div><p id="fallbackNote" class="fallback-note hidden">Si el navegador integrado bloquea la cámara, usa este botón para abrir directamente la cámara del teléfono.</p><p class="note">La foto queda asociada a tu tarjeta digital y no se publica en redes sociales.</p></main><script>
const API='https://api.alignmembers.com.mx/api/upload-profile-photo';
const params=new URLSearchParams(location.search),token=params.get('token');
const video=document.querySelector('#video'),preview=document.querySelector('#preview'),canvas=document.querySelector('#canvas'),capture=document.querySelector('#capture'),openCamera=document.querySelector('#openCamera'),cameraInput=document.querySelector('#cameraInput'),retake=document.querySelector('#retake'),save=document.querySelector('#save'),errorBox=document.querySelector('#error'),fallbackNote=document.querySelector('#fallbackNote');
let stream,photo='';
function showFallback(message='La cámara integrada está bloqueada en este navegador. Usa “Abrir cámara del iPhone”.'){errorBox.textContent=message;capture.classList.add('hidden');openCamera.classList.remove('hidden');fallbackNote.classList.remove('hidden')}
async function startCamera(){try{errorBox.textContent='';if(!token)throw new Error('Enlace de cuenta no válido.');if(!navigator.mediaDevices?.getUserMedia){showFallback();return}stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720},height:{ideal:720}},audio:false});video.srcObject=stream;capture.classList.remove('hidden');openCamera.classList.add('hidden');fallbackNote.classList.add('hidden')}catch(err){showFallback()}}
function stopCamera(){if(stream){stream.getTracks().forEach(track=>track.stop());stream=null}}
function usePhoto(dataUrl){photo=dataUrl;preview.src=photo;preview.style.display='block';video.style.display='none';capture.classList.add('hidden');openCamera.classList.add('hidden');retake.classList.remove('hidden');save.classList.remove('hidden');fallbackNote.classList.add('hidden');errorBox.textContent='';stopCamera()}
capture.addEventListener('click',()=>{if(!video.videoWidth){showFallback('No pude acceder a la vista de cámara. Usa “Abrir cámara del iPhone”.');return}const size=Math.min(video.videoWidth,video.videoHeight),sx=(video.videoWidth-size)/2,sy=(video.videoHeight-size)/2,ctx=canvas.getContext('2d');ctx.save();ctx.translate(320,0);ctx.scale(-1,1);ctx.drawImage(video,sx,sy,size,size,0,0,320,320);ctx.restore();let quality=.72,data=canvas.toDataURL('image/jpeg',quality);while(data.length>43000&&quality>.35){quality-=.08;data=canvas.toDataURL('image/jpeg',quality)}usePhoto(data)});
openCamera.addEventListener('click',()=>cameraInput.click());
cameraInput.addEventListener('change',()=>{const file=cameraInput.files?.[0];if(!file)return;const img=new Image();img.onload=()=>{const size=Math.min(img.naturalWidth,img.naturalHeight),sx=(img.naturalWidth-size)/2,sy=(img.naturalHeight-size)/2,ctx=canvas.getContext('2d');ctx.clearRect(0,0,320,320);ctx.drawImage(img,sx,sy,size,size,0,0,320,320);let quality=.72,data=canvas.toDataURL('image/jpeg',quality);while(data.length>43000&&quality>.35){quality-=.08;data=canvas.toDataURL('image/jpeg',quality)}URL.revokeObjectURL(img.src);usePhoto(data)};img.src=URL.createObjectURL(file)});
retake.addEventListener('click',()=>{photo='';preview.style.display='none';video.style.display='block';retake.classList.add('hidden');save.classList.add('hidden');cameraInput.value='';startCamera()});
save.addEventListener('click',async()=>{try{save.disabled=true;save.textContent='Guardando…';errorBox.textContent='';if(!photo)throw new Error('Primero toma o selecciona una foto.');const response=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,photo})});const data=await response.json();if(!response.ok)throw new Error(data.error||'No se pudo guardar la foto.');const queue=JSON.parse(localStorage.getItem('align_photo_queue')||'[]'),remaining=queue.filter(member=>member.token!==token);localStorage.setItem('align_photo_queue',JSON.stringify(remaining));if(remaining.length){location.replace(`profile-photo.html?token=${encodeURIComponent(remaining[0].token)}`)}else{localStorage.removeItem('align_photo_queue');const primary=localStorage.getItem('align_primary_token')||token;localStorage.removeItem('align_primary_token');location.replace(`member.html?token=${encodeURIComponent(primary)}`)}}catch(err){errorBox.textContent=err.message;save.disabled=false;save.textContent='Guardar y abrir tarjeta'}});
startCamera();
</script></body></html>
