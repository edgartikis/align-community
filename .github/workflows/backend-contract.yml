name: ALIGN Backend Contract

on:
  pull_request:
    branches: ["main"]
    paths:
      - "cloudflare/payments-worker/**"
      - "tests/stripe-runtime.test.mjs"
      - "scripts/check_live_health.py"
      - ".github/workflows/backend-contract.yml"
  push:
    branches: ["main"]
    paths:
      - "cloudflare/payments-worker/**"
      - "pago.html"
      - "stripe-checkout-bridge.js"
      - "login-github.html"
      - "portal.html"
      - "member.html"
      - "portal-aliados.html"
      - "profile-photo.html"
      - "payment-success.html"
      - "netlify.toml"
      - "scripts/check_backend_contract.py"
      - ".github/workflows/backend-contract.yml"
      - "tests/stripe-runtime.test.mjs"
      - "scripts/check_live_health.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed code
        uses: actions/checkout@v4
      - name: Verify canonical backend
        run: python scripts/check_backend_contract.py
      - name: Check Stripe Worker JavaScript syntax
        run: |
          for file in cloudflare/payments-worker/src/*.js; do node --check "$file"; done
      - name: Test Stripe Live/Test and renewal safety
        run: node --test tests/stripe-runtime.test.mjs
      - name: Test account deletion isolation and Stripe ownership (offline)
        run: |
          node --test \
            cloudflare/payments-worker/tests/account-deletion-billing.test.mjs \
            cloudflare/payments-worker/tests/member-account-deletion.test.mjs \
            cloudflare/payments-worker/tests/member-account-deletion-http.test.mjs \
            cloudflare/payments-worker/tests/reporting-account-erasure.test.mjs
      - name: Audit deployed Cloudflare health (read only)
        run: python scripts/check_live_health.py
