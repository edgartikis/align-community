name: ALIGN Backend Contract

on:
  push:
    branches: ["main"]
    paths:
      - "cloudflare/payments-worker/**"
      - "pago.html"
      - "stripe-checkout-bridge.js"
      - "login-github.html"
      - "portal.html"
      - "member.html"
      - "portal-aliados.html"
      - "profile-photo.html"
      - "payment-success.html"
      - "netlify.toml"
      - "scripts/check_backend_contract.py"
      - ".github/workflows/backend-contract.yml"
  pull_request:
    paths:
      - "cloudflare/payments-worker/**"
      - ".github/workflows/backend-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Verify canonical backend
        run: python scripts/check_backend_contract.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify billing lifecycle and QR access
        run: node --test cloudflare/payments-worker/test/*.test.js
