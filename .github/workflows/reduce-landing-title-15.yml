name: Reduce ALIGN landing title 15%

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/reduce-landing-title-15.yml"

permissions:
  contents: write

jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reduce landing headline by 15 percent
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '.gate h2{margin:0 auto;max-width:520px;font-size:clamp(2.5rem,7vw,5.4rem);line-height:.98;letter-spacing:-.045em}'
          new = '.gate h2{margin:0 auto;max-width:520px;font-size:clamp(2.125rem,5.95vw,4.59rem);line-height:.98;letter-spacing:-.045em}'
          if old not in s:
              raise SystemExit('Expected landing title style not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit change and clean temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reduce-landing-title-15.yml
          git add index.html
          git commit -m "Reduce ALIGN landing headline by 15 percent"
          git push
