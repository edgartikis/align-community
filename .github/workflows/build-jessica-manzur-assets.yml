name: Build Jessica Manzur assets
on:
  push:
    branches:
      - jessica-manzur-gallery
    paths:
      - .github/workflows/build-jessica-manzur-assets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', 'Generate Jessica Manzur image assets') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jessica-manzur-gallery
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install "Pillow==12.3.0"
      - name: Download originals and generate enhanced PNGs
        env:
          SRC01: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-3cc4-81f5-91e3-47fe3fcc7ba6/raw?se=2026-09-19T01%3A20%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=1bddbb7e-fabd-578d-98cf-05f38293b0fb&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T20%3A29%3A04Z&ske=2026-09-19T20%3A29%3A04Z&sks=b&skv=2026-02-06&sig=Ja8LxA3aljbADoED9OO9ftKgPiEkDJqduwGqq1wp9MQ%3D'
          SRC02: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-6340-81f5-b007-a881c8188ea0/raw?se=2026-09-19T01%3A20%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=c058146b-c586-5203-95ec-08237f6a49a7&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T20%3A31%3A33Z&ske=2026-09-19T20%3A31%3A33Z&sks=b&skv=2026-02-06&sig=5g45aKTNQVd9oNB42IOgmnYSOB1TjRDBMlvVkJ8kgu0%3D'
          SRC03: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-4478-81f5-8746-c1c13ecd758f/raw?se=2026-09-19T01%3A20%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=0c4c7fb3-c78d-599e-976b-f7282a85d350&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T20%3A29%3A21Z&ske=2026-09-19T20%3A29%3A21Z&sks=b&skv=2026-02-06&sig=83xC0A35/TjSVOkrnvzWKjyQ1RzN9VhTJDlDxxNE/TY%3D'
          SRC04: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-0ba4-81f5-8d56-bd662184e321/raw?se=2026-09-19T01%3A20%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=a3fd8b89-0847-5e6e-9e4a-75ed32f99301&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T20%3A20%3A10Z&ske=2026-09-19T20%3A20%3A10Z&sks=b&skv=2026-02-06&sig=78YqO%2B4CjKFPTatbpubH%2BrBv0%2BcVYRVUKhSQgpOXJyE%3D'
          SRC05: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-72d4-81f5-8aa3-9ae7c1f95bb0/raw?se=2026-09-19T01%3A20%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=f17f64e6-1b1e-5219-9b67-e5bf318ca655&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T20%3A24%3A30Z&ske=2026-09-19T20%3A24%3A30Z&sks=b&skv=2026-02-06&sig=EdSyv%2B7ZOwSGFBTmA1YZzvAHd%2BpPJNo/KyIpqFPndis%3D'
        run: |
          python - <<'PY'
          import os, urllib.request
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFilter

          out = Path("assets/jessica")
          out.mkdir(parents=True, exist_ok=True)
          jobs = [
              ("SRC01", "01_dental_consulta_mejorada.png"),
              ("SRC02", "02_antes_despues_mejorada.png"),
              ("SRC03", "03_consulta_monitor_mejorada.png"),
              ("SRC04", "04_consulta_modelo_dental_mejorada.png"),
              ("SRC05", "05_logo_jessica_manzur_mejorado.png"),
          ]

          for i, (env_name, output_name) in enumerate(jobs, 1):
              src = Path(f"/tmp/jm-{i:02}.jpg")
              urllib.request.urlretrieve(os.environ[env_name], src)
              img = Image.open(src).convert("RGB")
              img = img.filter(ImageFilter.MedianFilter(size=3))
              img = ImageEnhance.Contrast(img).enhance(1.035)
              img = ImageEnhance.Color(img).enhance(1.02)
              img = ImageEnhance.Brightness(img).enhance(1.01)
              img = img.resize((img.width * 2, img.height * 2), Image.Resampling.LANCZOS)
              img = img.filter(ImageFilter.UnsharpMask(radius=1.6, percent=135, threshold=3))
              img.save(out / output_name, "PNG", optimize=True)
          PY
      - name: Commit generated assets
        run: |
          rm -f .github/workflows/build-jessica-manzur-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jessica .github/workflows/build-jessica-manzur-assets.yml
          git commit -m "Generate Jessica Manzur image assets"
          git push origin HEAD:jessica-manzur-gallery
