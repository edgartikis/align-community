name: Build Jessica Manzur assets
on:
  push:
    branches:
      - jessica-manzur-gallery
    paths:
      - .github/workflows/build-jessica-manzur-assets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', 'Generate Jessica Manzur image assets') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jessica-manzur-gallery
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install "Pillow==12.3.0"
      - name: Generate enhanced PNGs
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFilter

          out = Path("assets/jessica")
          out.mkdir(parents=True, exist_ok=True)
          jobs = [
              (".jessica-source/01.jpeg", "01_dental_consulta_mejorada.png"),
              (".jessica-source/02.jpeg", "02_antes_despues_mejorada.png"),
              (".jessica-source/03.jpeg", "03_consulta_monitor_mejorada.png"),
              (".jessica-source/04.jpeg", "04_consulta_modelo_dental_mejorada.png"),
              (".jessica-source/05.jpeg", "05_logo_jessica_manzur_mejorado.png"),
          ]

          for source_name, output_name in jobs:
              img = Image.open(source_name).convert("RGB")
              img = img.filter(ImageFilter.MedianFilter(size=3))
              img = ImageEnhance.Contrast(img).enhance(1.035)
              img = ImageEnhance.Color(img).enhance(1.02)
              img = ImageEnhance.Brightness(img).enhance(1.01)
              img = img.resize((img.width * 2, img.height * 2), Image.Resampling.LANCZOS)
              img = img.filter(ImageFilter.UnsharpMask(radius=1.6, percent=135, threshold=3))
              img.save(out / output_name, "PNG", optimize=True)
          PY
      - name: Commit generated assets and clean temporary files
        run: |
          rm -rf .jessica-source
          rm -f .github/workflows/build-jessica-manzur-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/jessica .jessica-source .github/workflows/build-jessica-manzur-assets.yml
          git commit -m "Generate Jessica Manzur image assets"
          git push origin HEAD:jessica-manzur-gallery
