name: Sync ALIGN to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-sync"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Optimize site images
        shell: bash
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import re

          root = Path('.')

          # ------------------------------------------------------------
          # Homepage carousel
          # ------------------------------------------------------------
          carousel_dir = root / 'assets' / 'carousel'
          carousel_dir.mkdir(parents=True, exist_ok=True)

          images = [
              ('nuva-100.png', 'nuva.webp'),
              ('Global1.PNG', 'global-gym.webp'),
              ('Ginger1.PNG', 'gingers.webp'),
              ('BURGER1.jpeg', 'buns-and-bros.webp'),
              ('BORIS VERTICAL.png', 'boris-marisqueria.webp'),
              ('23B1C7B5-78F0-44A9-9C88-728FDFED2A23.png', 'uspin.webp'),
              ('16E29357-5A81-4689-8681-5AEA57D3D805.png', 'padel.webp'),
              ('CAPRI5-1.jpeg', 'velamar.webp'),
              ('Sante1.PNG', 'sante.webp'),
              ('public/images/events/WhatsApp Image 2026-07-23 at 6.31.29 PM.jpeg', 'vaca-fishing.webp'),
              ('ranchomx-1.png', 'rancho-mx.webp'),
              ('marea-1.jpg', 'marea-baja.webp'),
              ('public/images/events/WhatsApp Image 2026-07-23 at 6.31.30 PM.jpeg', 'boat-party.webp'),
              ('caballo1.png', 'horse-riding.webp'),

          ]

          index_path = root / 'index.html'
          html = index_path.read_text(encoding='utf-8')

          # Social link preview for WhatsApp / iMessage / social networks.
          social_meta = "\n".join([
              '<meta property="og:type" content="website">',
              '<meta property="og:url" content="https://alignmembers.com.mx/">',
              '<meta property="og:site_name" content="ALIGN">',
              '<meta property="og:title" content="ALIGN Membership">',
              '<meta property="og:description" content="La misma ciudad. Distinta experiencia. Beneficios, experiencias y comunidad en Tampico.">',
              '<meta property="og:image" content="https://alignmembers.com.mx/assets/align-share-v2.jpg">',
              '<meta property="og:image:secure_url" content="https://alignmembers.com.mx/assets/align-share-v2.jpg">',
              '<meta property="og:image:type" content="image/jpeg">',
              '<meta property="og:image:width" content="1200">',
              '<meta property="og:image:height" content="630">',
              '<meta property="og:image:alt" content="ALIGN Membership. La misma ciudad. Distinta experiencia.">',
              '<meta name="twitter:card" content="summary_large_image">',
              '<meta name="twitter:title" content="ALIGN Membership">',
              '<meta name="twitter:description" content="La misma ciudad. Distinta experiencia.">',
              '<meta name="twitter:image" content="https://alignmembers.com.mx/assets/align-share-v2.jpg">',
              '<link rel="canonical" href="https://alignmembers.com.mx/">',
          ])
          if 'property="og:image"' not in html:
              html = html.replace(
                  '<title>ALIGN Membership</title>',
                  '<title>ALIGN Membership</title>\n' + social_meta,
                  1,
              )

          if 'href="boris-marisqueria.html"' not in html:
              boris_card = '<a class="ally-mini" href="boris-marisqueria.html"><img src="BORIS VERTICAL.png" alt="Boris Marisquería"><div class="ally-copy"><span>Restaurants · Mariscos</span><h3>Boris Marisquería</h3><p>Mariscos y beneficios exclusivos ALIGN.</p></div></a>'
              buns_pattern = r'(<a class="ally-mini" href="buns-and-bros\.html">.*?</a>)'
              if len(re.findall(buns_pattern, html)) != 2:
                  raise RuntimeError('Expected two Buns & Bros cards in infinite carousel')
              html = re.sub(buns_pattern, lambda m: m.group(1) + '\n' + boris_card, html)

          replacements = []
          for source_name, target_name in images:
              source = root / source_name
              target = carousel_dir / target_name
              if not source.exists():
                  raise FileNotFoundError(source)
              with Image.open(source) as im:
                  im = ImageOps.exif_transpose(im)
                  im.thumbnail((720, 900), Image.Resampling.LANCZOS)
                  if im.mode not in ('RGB', 'RGBA'):
                      im = im.convert('RGB')
                  im.save(target, 'WEBP', quality=78, method=6)
              replacements.append((source_name.replace(' ', '%20') if source_name.startswith('public/') else source_name, f'assets/carousel/{target_name}'))

          for source_url, optimized_url in replacements:
              old = f'<img src="{source_url}"'
              first = f'<img loading="eager" decoding="async" fetchpriority="high" src="{optimized_url}"'
              lazy = f'<img loading="lazy" decoding="async" fetchpriority="low" src="{optimized_url}"'
              if old not in html:
                  raise RuntimeError(f'Carousel image reference not found: {source_url}')
              position = replacements.index((source_url, optimized_url))
              html = html.replace(old, first if position < 4 else lazy, 1)
              html = html.replace(old, lazy)

          index_path.write_text(html, encoding='utf-8')

          boris_dir = root / 'assets' / 'boris'
          boris_dir.mkdir(parents=True, exist_ok=True)
          boris_images = [(f'BORIS{i}.jpeg', f'boris{i}.webp') for i in range(1, 9)]

          original_boris = 0
          optimized_boris = 0
          for source_name, target_name in boris_images:
              source = root / source_name
              target = boris_dir / target_name
              if not source.exists():
                  raise FileNotFoundError(source)
              original_boris += source.stat().st_size
              with Image.open(source) as im:
                  im = ImageOps.exif_transpose(im)
                  im.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
                  if im.mode not in ('RGB', 'RGBA'):
                      im = im.convert('RGB')
                  im.save(target, 'WEBP', quality=76, method=6)
              optimized_boris += target.stat().st_size

          boris_path = root / 'boris-marisqueria.html'
          boris_html = boris_path.read_text(encoding='utf-8')
          for i in range(1, 9):
              boris_html = boris_html.replace(f'BORIS{i}.jpeg', f'assets/boris/boris{i}.webp')
          boris_html = boris_html.replace(
              '<img class="hero-slide active" src="assets/boris/boris1.webp"',
              '<img class="hero-slide active" loading="eager" decoding="async" fetchpriority="high" src="assets/boris/boris1.webp"',
              1,
          )
          for i in range(2, 9):
              boris_html = boris_html.replace(
                  f'<img class="hero-slide" src="assets/boris/boris{i}.webp"',
                  f'<img class="hero-slide" decoding="async" src="assets/boris/boris{i}.webp"',
                  1,
              )
          boris_html = boris_html.replace('loading="lazy" src="assets/boris/', 'loading="eager" decoding="async" src="assets/boris/')
          boris_html = boris_html.replace(
              '.gallery figure{margin:0;min-height:300px;overflow:hidden;background:#17323d}',
              '.gallery figure{margin:0;aspect-ratio:4/3;min-height:0;overflow:hidden;background:#17323d}',
              1,
          )
          boris_path.write_text(boris_html, encoding='utf-8')

          original_carousel = sum((root / src).stat().st_size for src, _ in images)
          optimized_carousel = sum((carousel_dir / dst).stat().st_size for _, dst in images)
          print(f'Carousel originals: {original_carousel / 1024 / 1024:.2f} MB')
          print(f'Carousel optimized: {optimized_carousel / 1024 / 1024:.2f} MB')
          print(f'Boris originals: {original_boris / 1024 / 1024:.2f} MB')
          print(f'Boris optimized: {optimized_boris / 1024 / 1024:.2f} MB')
          PY

      - name: Optimize remaining website images
        shell: bash
        run: |
          python scripts/optimize_site.py

      - name: Optimize referenced website videos
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python scripts/optimize_videos.py

      - name: Generate official ALIGN social sharing image
        shell: bash
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import cairosvg

          width, height = 1200, 630
          card = Image.new('RGB', (width, height))
          draw = ImageDraw.Draw(card)

          # Reserved, brand-consistent navy gradient, with no white/transparency.
          for y in range(height):
              t = y / (height - 1)
              draw.line([(0, y), (width, y)], fill=(
                  round(7 + 13 * t),
                  round(21 + 23 * t),
                  round(36 + 30 * t),
              ))
          draw.line([(495, 110), (495, 520)], fill=(100, 120, 142), width=2)

          # Render the verified official logo supplied by the ALIGN owner, preserving the full silhouette.
          svg_path = Path('assets/align-cordero-official.svg')
          if not svg_path.is_file():
              raise FileNotFoundError(svg_path)
          logo_bytes = cairosvg.svg2png(url=str(svg_path), output_width=540, output_height=540)
          logo = Image.open(BytesIO(logo_bytes)).convert('RGBA')
          logo_on_card = logo.resize((420, 420), Image.Resampling.LANCZOS)
          card.paste(logo_on_card, (50, 103), logo_on_card)

          # Favicon: the same official ram mark, cropped above the ALIGN wordmark.
          ram_only = logo.crop((75, 20, 460, 455))
          ram_only.thumbnail((190, 190), Image.Resampling.LANCZOS)
          icon = Image.new('RGBA', (220, 220), (0, 0, 0, 0))
          icon_x, icon_y = (220 - ram_only.width) // 2, (220 - ram_only.height) // 2
          icon.paste(ram_only, (icon_x, icon_y), ram_only)
          icon_path = Path('assets/align-favicon-v2.png')
          icon.save(icon_path, 'PNG', optimize=True)

          regular = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          serif = '/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf'
          tagline = ImageFont.truetype(serif, 39)
          small = ImageFont.truetype(regular, 17)
          micro = ImageFont.truetype(regular, 13)
          draw.text((548, 215), 'La misma ciudad.', font=tagline, fill=(245, 243, 239))
          draw.text((548, 283), 'Distinta experiencia.', font=tagline, fill=(245, 243, 239))
          draw.line([(550, 367), (1020, 367)], fill=(143, 162, 178), width=1)
          draw.text((550, 397), 'ALIGN MEMBERSHIP', font=small, fill=(211, 219, 229))
          draw.text((550, 437), 'TAMPICO  /  MADERO  /  ALTAMIRA', font=micro, fill=(177, 190, 204))

          output = Path('assets/align-share-v2.jpg')
          card.save(output, 'JPEG', quality=93, optimize=True, subsampling=0)
          assert Image.open(output).size == (1200, 630)
          print(f'Social preview: {output}, {output.stat().st_size} bytes')
          PY

      - name: Publish main to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          force_orphan: true
          enable_jekyll: false
