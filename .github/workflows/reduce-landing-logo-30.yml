name: Reduce ALIGN landing logo 30%

on:
  push:
    paths:
      - '.github/workflows/reduce-landing-logo-30.yml'

permissions:
  contents: write

jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Reduce landing logo size by 30 percent
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_desktop = '.gate-logo-wrap{position:relative;width:min(250px,58vw);margin:0 auto 22px;display:block}'
          new_desktop = '.gate-logo-wrap{position:relative;width:min(175px,40.6vw);margin:0 auto 22px;display:block}'
          old_mobile = '.gate-logo-wrap{width:min(220px,56vw);margin-bottom:18px}'
          new_mobile = '.gate-logo-wrap{width:min(154px,39.2vw);margin-bottom:18px}'

          if old_desktop not in s:
              raise SystemExit('Desktop logo size rule not found')
          if old_mobile not in s:
              raise SystemExit('Mobile logo size rule not found')

          s = s.replace(old_desktop, new_desktop, 1)
          s = s.replace(old_mobile, new_mobile, 1)
          p.write_text(s, encoding='utf-8')
          PY

          rm -f .github/workflows/reduce-landing-logo-30.yml

      - name: Commit resized logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reduce ALIGN landing logo by 30 percent"
          git push origin HEAD:main
