name: Update Velamar WhatsApp

on:
  push:
    paths:
      - '.github/workflows/update-velamar-whatsapp.yml'

permissions:
  contents: write

jobs:
  update-whatsapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replace WhatsApp destination
        run: |
          files=(marmara-11.html marmara-8.html capri-5.html capri-3.html penthouse-capri.html)
          for file in "${files[@]}"; do
            sed -i 's/528332835633/528331472076/g' "$file"
          done
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marmara-11.html marmara-8.html capri-5.html capri-3.html penthouse-capri.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Update Velamar WhatsApp destination"
          git push
