name: Remove gold star decorations
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove-gold-stars.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove decorative gold stars
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('.proof article:before{content:"✦";position:absolute;right:18px;top:18px;color:var(--gold2);opacity:.55}', '.proof article:before{content:none}')
          s=s.replace('<div class="ornament">✦ · ✦ · ✦</div>', '')
          p.write_text(s)
          PY
      - name: Commit cleanup
        run: |
          git config user.name "edgartikis"
          git config user.email "edgartikis@gmail.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove gold star decorations from home"
          git pull --rebase origin main
          git push origin HEAD:main
