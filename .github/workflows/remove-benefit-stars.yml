name: Remove benefit stars
on:
  push:
    paths:
      - '.github/workflows/remove-benefit-stars.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove decorative stars
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='.proof article:before{content:"✦";position:absolute;right:18px;top:18px;color:var(--gold2);opacity:.55}'
          s=s.replace(old,'.proof article:before{content:none;display:none}')
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove decorative stars from benefits"
          git push
