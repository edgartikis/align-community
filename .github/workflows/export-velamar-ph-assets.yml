name: Export Velamar penthouse assets

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/export-velamar-ph-assets.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: velamar-ph-assets
          path: |
            PH2.jpeg
            PH4.jpeg
            PH5.jpeg
            PH6.jpeg
            PH7.jpeg
          if-no-files-found: error
          retention-days: 1
