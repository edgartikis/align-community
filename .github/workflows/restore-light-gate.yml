name: Restore animated ALIGN gate
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-light-gate.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original animated light gate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          css='''body.is-locked{overflow:hidden}.gate{position:fixed;z-index:1000;inset:0;display:grid;place-items:center;overflow:hidden;padding:28px;text-align:center;background:radial-gradient(circle at 50% 42%,#18304f 0%,#0b1727 34%,#05070b 74%);transition:opacity .8s ease,visibility .8s ease}.gate::before,.gate::after{content:"";position:absolute;inset:-25%;pointer-events:none}.gate::before{background:conic-gradient(from 210deg at 50% 52%,transparent 0 31%,rgba(218,226,238,.08) 37%,transparent 43% 69%,rgba(218,226,238,.05) 75%,transparent 82%);animation:gateGlow 8s linear infinite}.gate::after{inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.055) 50%,transparent 62%);transform:translateX(-100%);animation:gateSheen 4.5s ease-in-out infinite}.gate.opening{opacity:0;visibility:hidden}.gate-card{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;max-width:620px;background:transparent;border:0;box-shadow:none;padding:0;animation:gateEnter 1.1s ease both}.gate-mark{width:76px;height:76px;display:grid;place-items:center;margin-bottom:28px;border:1px solid rgba(245,242,236,.75);border-radius:50%;font-family:"Playfair Display",serif;font-size:2.45rem;box-shadow:0 0 50px rgba(173,195,224,.12)}.gate-kicker{margin:0 0 14px;font-family:"DM Mono",monospace;font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:#bfc7d3}.gate h2{margin:0;font-family:"Playfair Display",serif;font-size:clamp(2.5rem,7vw,5.4rem);font-weight:500;line-height:.98;letter-spacing:-.045em}.gate-copy{max-width:430px;margin:20px auto 30px;color:#c8ccd2;line-height:1.6}.gate-btn{position:relative;min-width:235px;padding:15px 26px;border:1px solid rgba(245,242,236,.75);background:rgba(245,242,236,.03);color:#f5f2ec;font-family:"DM Mono",monospace;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:background .25s ease,color .25s ease,transform .25s ease,box-shadow .25s ease}.gate-btn:hover{background:#f5f2ec;color:#090a0c;transform:translateY(-2px);box-shadow:0 15px 45px rgba(0,0,0,.28)}.gate.opening .gate-card{transform:scale(1.035);opacity:0;transition:transform .7s ease,opacity .5s ease}@keyframes gateEnter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes gateGlow{to{transform:rotate(360deg)}}@keyframes gateSheen{0%,52%{transform:translateX(-100%)}78%,100%{transform:translateX(100%)}}@media(prefers-reduced-motion:reduce){.gate::before,.gate::after,.gate-card{animation:none}}'''
          s=re.sub(r'body\.is-locked\{overflow:hidden\}\.gate\{.*?(?=\.nav\{)',css,s,flags=re.S)
          s=s.replace('<div class="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title"><div class="gate-card"><div class="gate-mark">A</div><p class="gate-kicker">ALIGN Membership</p><h2 id="gate-title">Tu ciudad,<br>vista diferente.</h2><p class="gate-copy">Experiencias, lugares y beneficios seleccionados para quienes buscan vivir algo más.</p><button class="gate-btn" type="button">Entrar a la experiencia</button></div></div>','<div class="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title"><div class="gate-card"><div class="gate-mark">A</div><p class="gate-kicker">ALIGN Community</p><h2 id="gate-title">Tu ciudad,<br>vista diferente.</h2><p class="gate-copy">Experiencias, lugares y beneficios seleccionados para quienes buscan vivir algo más.</p><button class="gate-btn" type="button">Entrar a la experiencia</button><p style="margin:15px 0 0;font-size:.67rem;letter-spacing:.08em;color:#8f99a8">Descubre ALIGN Membership</p></div></div>')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore animated light entry gate" || exit 0
          git push
