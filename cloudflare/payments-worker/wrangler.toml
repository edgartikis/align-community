name = "align-payments"
main = "src/main.js"
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "PAYMENT_STATE"
id = "4504d6bcead74cdfa7e3a76599f641fc"

[vars]
# LIVE Stripe Price IDs. Merge only when STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET are switched to Live in Cloudflare.
SITE_ORIGIN = "https://alignmembers.com.mx"
STRIPE_PRICE_BROTHERHOOD_FOUNDER = "price_1UHAjyE2qRZRC8p2NFE5nsgH"
STRIPE_PRICE_BROTHERHOOD_REGULAR = "price_1UHAjxE2qRZRC8p2PL3eBgdq"
STRIPE_PRICE_GIRLS_FOUNDER = "price_1UHAjyE2qRZRC8p2hoe8BFo7"
STRIPE_PRICE_GIRLS_REGULAR = "price_1UHAjxE2qRZRC8p2Q0YMZHWu"
STRIPE_PRICE_RANCH_FOUNDER = "price_1UHAjyE2qRZRC8p288ZRPAOn"
STRIPE_PRICE_RANCH_REGULAR = "price_1UHAjxE2qRZRC8p2ejNved1E"
STRIPE_PRICE_DUO = "price_1UHAjxE2qRZRC8p2csZ0xQq0"
STRIPE_PRICE_CIRCLE = "price_1UHAjxE2qRZRC8p2odXD4Bc5"

# Backend canónico: Cloudflare Worker + PAYMENT_STATE (KV).
# Los secretos se configuran en Cloudflare, nunca en GitHub:
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# QR_SIGNING_SECRET (opcional; si falta, usa STRIPE_SECRET_KEY)
# ALIGN_DB_URL / ALIGN_DB_SECRET (solo sincronización secundaria de reportes)
