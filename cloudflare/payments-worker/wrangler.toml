name = "align-payments"
main = "src/main.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# QR revision authority; production remains disabled by feature flag.
[[durable_objects.bindings]]
name = "APP_QR_AUTHORITY"
class_name = "AlignAppQrAuthority"

[[migrations]]
tag = "align-app-qr-sqlite-v1"
new_sqlite_classes = ["AlignAppQrAuthority"]

[[kv_namespaces]]
binding = "PAYMENT_STATE"
id = "4504d6bcead74cdfa7e3a76599f641fc"

[vars]
SITE_ORIGIN = "https://alignmembers.com.mx"

# Safe Stripe mode switch. Keep TEST until both LIVE secrets exist in Cloudflare.
STRIPE_MODE = "live"

# Stripe TEST prices (current production behavior while STRIPE_MODE=test).
STRIPE_PRICE_BROTHERHOOD_FOUNDER = "price_1UCObaE3kQapeVY6EBBRWOxA"
STRIPE_PRICE_BROTHERHOOD_REGULAR = "price_1UCOchE3kQapeVY6UmHvHCtv"
STRIPE_PRICE_GIRLS_FOUNDER = "price_1UCOliE3kQapeVY67WH7jhsm"
STRIPE_PRICE_GIRLS_REGULAR = "price_1UCOloE3kQapeVY6WI2JL0xV"
STRIPE_PRICE_RANCH_FOUNDER = "price_1UCOluE3kQapeVY66TwmVRK5"
STRIPE_PRICE_RANCH_REGULAR = "price_1UCOlyE3kQapeVY6Pr7LCFmy"
STRIPE_PRICE_DUO = "price_1UCOm5E3kQapeVY6v4V9uYYj"
STRIPE_PRICE_CIRCLE = "price_1UCOmAE3kQapeVY67pUKUfTm"

# Stripe LIVE prices. Used only when STRIPE_MODE=live.
STRIPE_PRICE_BROTHERHOOD_FOUNDER_LIVE = "price_1UHAjyE2qRZRC8p2NFE5nsgH"
STRIPE_PRICE_BROTHERHOOD_REGULAR_LIVE = "price_1UHAjxE2qRZRC8p2PL3eBgdq"
STRIPE_PRICE_GIRLS_FOUNDER_LIVE = "price_1UHAjyE2qRZRC8p2hoe8BFo7"
STRIPE_PRICE_GIRLS_REGULAR_LIVE = "price_1UHAjxE2qRZRC8p2Q0YMZHWu"
STRIPE_PRICE_RANCH_FOUNDER_LIVE = "price_1UHAjyE2qRZRC8p288ZRPAOn"
STRIPE_PRICE_RANCH_REGULAR_LIVE = "price_1UHAjxE2qRZRC8p2ejNved1E"
STRIPE_PRICE_DUO_LIVE = "price_1UHAjxE2qRZRC8p2csZ0xQq0"
STRIPE_PRICE_CIRCLE_LIVE = "price_1UHAjxE2qRZRC8p2odXD4Bc5"

# Backend canónico: Cloudflare Worker + PAYMENT_STATE (KV).
# Los secretos se configuran en Cloudflare, nunca en GitHub:
# STRIPE_SECRET_KEY (TEST actual)
# STRIPE_WEBHOOK_SECRET (TEST actual)
# STRIPE_SECRET_KEY_LIVE (añadir antes de STRIPE_MODE=live)
# STRIPE_WEBHOOK_SECRET_LIVE (añadir antes de STRIPE_MODE=live)
# QR_SIGNING_SECRET (opcional; si falta, usa la clave Stripe del modo activo)
# ALIGN_DB_URL / ALIGN_DB_SECRET (solo sincronización secundaria de reportes)

# Preview-only screenshot QR rotation for native iOS; do not enable production without approval.
# ALIGN_APP_QR_SECRET is a private Cloudflare secret of at least 32 characters.
ALIGN_APP_QR_ROTATION_ENABLED = "false"
# Native login throttling is disabled in production. Preview tests only.
MEMBER_LOGIN_GUARD = "false"
# V2 plaintext-over-HTTPS / salted PBKDF2 sign-in: NEVER enable in production without approval.
MEMBER_PASSWORD_V2 = "false"
# Secure account deletion is gated OFF for production until reviewed and tested.
MEMBER_ACCOUNT_DELETION_ENABLED = "false"

# Official Apple Wallet pass: disabled until signed, approved and tested on iPhone.
WALLET_ENABLED = "false"
# Single-member test is OFF by default. Activate only by separate approval and
# expiring SHA-256 allowlist in Cloudflare secrets. Does not enable general issue.
WALLET_PILOT_ENABLED = "false"
# Owner-only production QR validation and private reissue, explicitly
# approved on 2026-10-12. Does NOT enable general Wallet for members.
# Preview remains disabled. Disable this flag to revoke owner Wallet access.
WALLET_OWNER_ENABLED = "true"
WALLET_TEAM_ID = "2WG8DN922L"
# Private Cloudflare secrets only, never commit real PEM values:
# WALLET_SIGNER_CERT_PEM / WALLET_SIGNER_KEY_PEM / WALLET_WWDR_PEM
# WALLET_SIGNER_KEY_PASSPHRASE, when applicable.

# Worker previews must NEVER inherit the production membership KV.
# Preview issuance remains disabled until a separate approved staging test.
[previews]

# Cloudflare creates a separate DO namespace for EACH Preview. Without this
# explicit env binding, APP_QR_AUTHORITY is unavailable at runtime.
[[previews.durable_objects.bindings]]
name = "APP_QR_AUTHORITY"
class_name = "AlignAppQrAuthority"

[previews.vars]
SITE_ORIGIN = "https://alignmembers.com.mx"
STRIPE_MODE = "test"
# Preview-only: ally session signatures use a distinct private QR_SIGNING_SECRET.
# Production remains on its original signing configuration.
QR_SIGNING_CUTOVER = "true"
# Preview KV is segregated from production. Only preview can exercise this feature.
ALIGN_APP_QR_ROTATION_ENABLED = "true"
# Isolated smoke tests: limit repeated failed logins per username and source IP.
MEMBER_LOGIN_GUARD = "true"
# Native Preview beta exclusively; the legacy SHA-256 login route is blocked while enabled.
MEMBER_PASSWORD_V2 = "true"
# Isolated one-account account-deletion acceptance test; production remains OFF.
# Only this disposable QA username can ever reach the destructive handler here.
MEMBER_ACCOUNT_DELETION_ENABLED = "true"
MEMBER_ACCOUNT_DELETION_TEST_USERNAME = "qa.delete.fixture2"
WALLET_ENABLED = "false"
# Single-member test is OFF by default. Activate only by separate approval and
# expiring SHA-256 allowlist in Cloudflare secrets. Does not enable general issue.
WALLET_PILOT_ENABLED = "false"
# The canonical, complimentary owner is independent of pilot expiry.
# Owner reissue and QR validation remain OFF until separately approved.
# This never activates public Wallet for paying members.
WALLET_OWNER_ENABLED = "false"
WALLET_TEAM_ID = "2WG8DN922L"

[[previews.kv_namespaces]]
binding = "PAYMENT_STATE"
id = "4b23fffb26264609b9f18f110baea954"
