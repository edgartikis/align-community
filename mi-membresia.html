<!doctype html>
<html lang="es-MX">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1119"><title>Mi membresía | ALIGN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4f1eb;--line:rgba(255,255,255,.14);--gold:#d9c6a5}*{box-sizing:border-box}body{margin:0;background:#090a0c;color:var(--paper);font-family:"DM Sans",sans-serif}a{color:inherit;text-decoration:none}.nav{display:flex;justify-content:space-between;align-items:center;padding:20px 5vw;border-bottom:1px solid var(--line);background:#0b0d11}.brand{font:500 1.25rem "Playfair Display",serif;letter-spacing:.2em}.logout{border:0;background:none;color:#aaa;font:500 .68rem "DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.hero{padding:76px 5vw 58px;background:radial-gradient(circle at 80% 0,#23476f 0,transparent 38%),linear-gradient(145deg,#111820,#090a0c)}.eyebrow{margin:0 0 14px;font:500 .68rem "DM Mono",monospace;letter-spacing:.15em;text-transform:uppercase;color:#aeb4bd}.hero-grid{display:grid;grid-template-columns:1.4fr .8fr;gap:30px;align-items:end}h1,h2,h3{font-family:"Playfair Display",serif;font-weight:500}.hero h1{margin:0;font-size:clamp(3rem,7vw,6.5rem);line-height:.92;letter-spacing:-.05em}.hero p{max-width:560px;color:#c7c9cd;line-height:1.65}.card{padding:28px;border:1px solid rgba(217,198,165,.35);background:linear-gradient(145deg,#17395f,#08131f);box-shadow:0 25px 60px rgba(0,0,0,.35)}.card.black{background:linear-gradient(145deg,#29292b,#020202)}.level{margin:4px 0 18px;font:500 3.2rem "Playfair Display",serif}.meta{display:flex;justify-content:space-between;gap:15px;padding-top:17px;border-top:1px solid var(--line);font:500 .68rem "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase}.section{padding:72px 5vw}.section.light{background:var(--paper);color:#090a0c}.section h2{margin:0 0 28px;font-size:clamp(2.4rem,5vw,4.5rem);line-height:.98;letter-spacing:-.04em}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.benefit{padding:25px;border:1px solid rgba(9,10,12,.15);background:#fff}.benefit h3{margin:0;font-size:1.8rem;line-height:1.05}.benefit p{color:#555;line-height:1.55}.pill{display:inline-block;margin-top:12px;padding:7px 10px;border:1px solid rgba(9,10,12,.2);font:500 .63rem "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase}.cta{display:inline-block;margin-top:28px;padding:13px 18px;border:1px solid currentColor;font:600 .68rem "DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase}@media(max-width:850px){.hero-grid,.grid{grid-template-columns:1fr}.card{margin-top:15px}}
</style></head>
<body>
<nav class="nav"><a class="brand" href="./">ALIGN</a><button class="logout" id="logout">Cerrar sesión</button></nav>
<main id="app"></main>
<script>
const qs=new URLSearchParams(location.search);const code=qs.get('member')||sessionStorage.getItem('align_member_code');const level=qs.get('level')||sessionStorage.getItem('align_member_level')||'Society';if(!code){location.replace('login.html')}const black=level==='Black';const benefits=black?[{n:'Marea Baja Surfing School',o:'2×1 permanente en clases de surf en Playa Miramar.'},{n:'Vaca Fishing',o:'Precio preferencial y sexta hora gratis después de cinco horas.'},{n:'Experiencias ALIGN',o:'Acceso prioritario a eventos, activaciones y beneficios Black.'}]:[{n:'Marea Baja Surfing School',o:'Cada clase baja de $350 a $250 MXN.'},{n:'Experiencias ALIGN',o:'Acceso a beneficios y eventos seleccionados para Society.'},{n:'Aliados seleccionados',o:'Promociones individuales al presentar tu membresía.'}];document.querySelector('#app').innerHTML=`<section class="hero"><div class="hero-grid"><div><p class="eyebrow">Mi portal ALIGN</p><h1>Tu membresía ya está activa.</h1><p>Consulta tus beneficios actuales y presenta tu número de socio con cada aliado participante.</p></div><aside class="card ${black?'black':''}"><p class="eyebrow">ALIGN Membership</p><div class="level">${level}</div><div class="meta"><span>${code}</span><span>Activa</span></div></aside></div></section><section class="section light"><p class="eyebrow">Beneficios disponibles</p><h2>Vive la ciudad diferente.</h2><div class="grid">${benefits.map(b=>`<article class="benefit"><h3>${b.n}</h3><p>${b.o}</p><span class="pill">Beneficio activo</span></article>`).join('')}</div><a class="cta" href="marea-baja.html">Ver Marea Baja</a></section>`;document.querySelector('#logout').onclick=()=>{sessionStorage.removeItem('align_member_code');sessionStorage.removeItem('align_member_level');location.replace('login.html')};
</script></body></html>
