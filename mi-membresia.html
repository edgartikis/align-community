<!doctype html>
<html lang="es-MX">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1119"><title>Mi membresía | ALIGN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{--paper:#f4f1eb;--line:rgba(255,255,255,.14);--gold:#d9c6a5}*{box-sizing:border-box}body{margin:0;background:#090a0c;color:var(--paper);font-family:"DM Sans",sans-serif}a{color:inherit;text-decoration:none}button{font:inherit}.nav{display:flex;justify-content:space-between;align-items:center;padding:20px 5vw;border-bottom:1px solid var(--line);background:#0b0d11}.brand{font:500 1.25rem "Playfair Display",serif;letter-spacing:.2em}.logout{border:0;background:none;color:#aaa;font:500 .68rem "DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.hero{padding:76px 5vw 58px;background:radial-gradient(circle at 80% 0,#23476f 0,transparent 38%),linear-gradient(145deg,#111820,#090a0c)}.eyebrow{margin:0 0 14px;font:500 .68rem "DM Mono",monospace;letter-spacing:.15em;text-transform:uppercase;color:#aeb4bd}.hero-grid{display:grid;grid-template-columns:1.4fr .8fr;gap:30px;align-items:end}h1,h2,h3{font-family:"Playfair Display",serif;font-weight:500}.hero h1{margin:0;font-size:clamp(3rem,7vw,6.5rem);line-height:.92;letter-spacing:-.05em}.hero p{max-width:560px;color:#c7c9cd;line-height:1.65}.card{padding:28px;border:1px solid rgba(217,198,165,.35);background:linear-gradient(145deg,#17395f,#08131f);box-shadow:0 25px 60px rgba(0,0,0,.35)}.card.black{background:linear-gradient(145deg,#29292b,#020202)}.level{margin:4px 0 18px;font:500 3.2rem "Playfair Display",serif}.meta{display:flex;justify-content:space-between;gap:15px;padding-top:17px;border-top:1px solid var(--line);font:500 .68rem "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase}.card-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.mini-btn,.cta{display:inline-block;padding:12px 15px;border:1px solid currentColor;background:transparent;color:inherit;font:600 .65rem "DM Mono",monospace;letter-spacing:.09em;text-transform:uppercase;cursor:pointer}.section{padding:72px 5vw}.section.light{background:var(--paper);color:#090a0c}.section h2{margin:0 0 28px;font-size:clamp(2.4rem,5vw,4.5rem);line-height:.98;letter-spacing:-.04em}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.benefit{display:flex;flex-direction:column;padding:25px;border:1px solid rgba(9,10,12,.15);background:#fff}.benefit h3{margin:0;font-size:1.8rem;line-height:1.05}.benefit p{color:#555;line-height:1.55}.pill{display:inline-block;margin-top:12px;padding:7px 10px;border:1px solid rgba(9,10,12,.2);font:500 .63rem "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase}.benefit .cta{margin-top:auto;padding-top:12px;align-self:flex-start}.bottom-grid{display:grid;grid-template-columns:1.4fr .6fr;gap:18px;margin-top:18px}.savings{padding:28px;background:#10151d;border:1px solid var(--line)}.savings strong{display:block;margin-top:6px;font:500 clamp(3rem,7vw,5.8rem) "Playfair Display",serif;color:var(--gold)}.savings p{color:#aeb4bd;line-height:1.55}.modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:24px;background:rgba(0,0,0,.78);backdrop-filter:blur(12px)}.modal.open{display:grid}.digital-card{width:min(100%,420px);padding:26px;background:linear-gradient(145deg,#29292b,#020202);border:1px solid rgba(217,198,165,.45);box-shadow:0 35px 100px rgba(0,0,0,.6)}.member-photo{width:94px;height:94px;border-radius:50%;display:grid;place-items:center;margin:0 0 22px;background:#d9c6a5;color:#101010;font:600 2rem "Playfair Display",serif;overflow:hidden}.member-photo img{width:100%;height:100%;object-fit:cover}.qr-wrap{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}#qr{padding:10px;background:#fff}.close{width:100%;margin-top:18px;padding:12px;border:1px solid #fff;background:transparent;color:#fff;cursor:pointer}@media(max-width:850px){.hero-grid,.grid,.bottom-grid{grid-template-columns:1fr}.card{margin-top:15px}}@media(max-width:520px){.qr-wrap{grid-template-columns:1fr}.qr-wrap #qr{width:max-content}}
</style></head>
<body>
<nav class="nav"><a class="brand" href="./">ALIGN</a><button class="logout" id="logout">Cerrar sesión</button></nav>
<main id="app"></main>
<div class="modal" id="cardModal" aria-hidden="true"><section class="digital-card"><p class="eyebrow">ALIGN Membership</p><div class="member-photo" id="memberPhoto">A</div><div class="level" id="modalLevel"></div><div class="meta"><span id="modalCode"></span><span>Activa</span></div><div class="qr-wrap"><div><p class="eyebrow">Tarjeta digital</p><p style="color:#bbb;line-height:1.5">Presenta este código con el aliado para validar tu membresía.</p></div><div id="qr"></div></div><button class="close" id="closeModal">Cerrar tarjeta</button></section></div>
<script>
const qs=new URLSearchParams(location.search);const code=qs.get('member')||sessionStorage.getItem('align_member_code');const level=qs.get('level')||sessionStorage.getItem('align_member_level')||'Society';if(!code){location.replace('login.html')}sessionStorage.setItem('align_member_code',code);sessionStorage.setItem('align_member_level',level);const black=level==='Black';const savings=Number(localStorage.getItem(`align_savings_${code}`)||0);const benefits=black?[{n:'Marea Baja Surfing School',o:'2×1 permanente en clases de surf en Playa Miramar.',u:'marea-baja.html',b:'Ver Marea Baja'},{n:'Vaca Fishing',o:'Precio preferencial y sexta hora gratis después de cinco horas.',u:'dia-de-pesca.html',b:'Ver Vaca Fishing'},{n:'Experiencias ALIGN',o:'Acceso prioritario a eventos, activaciones y beneficios Black.',u:'experiencias-align.html',b:'Ver experiencias'}]:[{n:'Marea Baja Surfing School',o:'Cada clase baja de $350 a $250 MXN.',u:'marea-baja.html',b:'Ver Marea Baja'},{n:'Experiencias ALIGN',o:'Acceso a beneficios y eventos seleccionados para Society.',u:'experiencias-align.html',b:'Ver experiencias'},{n:'Aliados seleccionados',o:'Promociones individuales al presentar tu membresía.',u:'#',b:'Próximamente'}];document.querySelector('#app').innerHTML=`<section class="hero"><div class="hero-grid"><div><p class="eyebrow">Mi portal ALIGN</p><h1>Tu membresía ya está activa.</h1><p>Consulta tus beneficios actuales, abre tu tarjeta digital y presenta tu QR con cada aliado participante.</p></div><aside class="card ${black?'black':''}"><p class="eyebrow">ALIGN Membership</p><div class="level">${level}</div><div class="meta"><span>${code}</span><span>Activa</span></div><div class="card-actions"><button class="mini-btn" id="viewCard">Ver tarjeta</button></div></aside></div></section><section class="section light"><p class="eyebrow">Beneficios disponibles</p><h2>Vive la ciudad diferente.</h2><div class="grid">${benefits.map(b=>`<article class="benefit"><h3>${b.n}</h3><p>${b.o}</p><span class="pill">Beneficio activo</span><a class="cta" href="${b.u}?member=${encodeURIComponent(code)}&level=${encodeURIComponent(level)}">${b.b}</a></article>`).join('')}</div></section><section class="section"><div class="bottom-grid"><div><p class="eyebrow">Tu actividad ALIGN</p><h2 style="margin:0">Cada experiencia suma.</h2></div><aside class="savings"><p class="eyebrow">Monto ahorrado</p><strong>$${savings.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})}</strong><p>Se actualizará conforme los aliados registren tus consumos y beneficios.</p></aside></div></section>`;
const modal=document.querySelector('#cardModal');document.querySelector('#modalLevel').textContent=level;document.querySelector('#modalCode').textContent=code;document.querySelector('#viewCard').onclick=()=>{modal.classList.add('open');modal.setAttribute('aria-hidden','false');if(!document.querySelector('#qr canvas')&&!document.querySelector('#qr img'))new QRCode(document.querySelector('#qr'),{text:`ALIGN|${code}|${level}`,width:150,height:150})};document.querySelector('#closeModal').onclick=()=>{modal.classList.remove('open');modal.setAttribute('aria-hidden','true')};modal.onclick=e=>{if(e.target===modal)document.querySelector('#closeModal').click()};document.querySelector('#logout').onclick=()=>{sessionStorage.removeItem('align_member_code');sessionStorage.removeItem('align_member_level');location.replace('login.html')};
</script></body></html>
