};
const CATS=[

{id:'pilates',n:'PILATES',bg:"url('Sante5.PNG')",a:['sante','nuva']},
{id:'padel',n:'PÁDEL',bg:"url('https://images.unsplash.com/photo-1622163642998-1ea32b0bbc67?auto=format&fit=crop&w=1200&q=80')",a:['padel1111']},

const ESC=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#039;'})[c]);async function loadPortal(){try{let group,response;if(master){group={primary:{token:'MYTIME',name:'Edgar',level:'Universal Access',memberCode:'MYTIME',photoUrl:'',savings:0}};response={ok:true}}else if(params.get('demo')==='1'||location.hostname==='edgartikis.github.io'){group=JSON.parse(localStorage.getItem('align_demo_group')||'null');response={ok:!!group}}else{throw new Error('Este acceso temporal está configurado para GitHub Pages.');}const member=group?.primary;if(!response.ok||!member)throw new Error(group?.error||'Membresía no disponible.');const level=String(member.level||'').toLowerCase(),planKey=level.includes('brotherhood')?'brotherhood':level.includes('girls')?'girls':level.includes('ranch')?'ranch':level.includes('duo')?'duo':level.includes('circle')?'circle':null,cats=CATS.map(cat=>({...cat,a:cat.a.filter(id=>master||(planKey&&ALLIES[id].plans.includes(planKey)))})).filter(cat=>cat.keep||cat.direct||cat.a.length);document.querySelector('#app').innerHTML=`<section class="hero"><div class="hero-grid"><div><p class="eyebrow">Mi portal ALIGN</p><h1>Hola, ${ESC(member.name)}.</h1><p class="hero-copy">${master?'Acceso universal activo. Puedes revisar todas las categorías y aliados de ALIGN.':'Explora tus beneficios por categoría y abre tu tarjeta digital cuando la necesites.'}</p></div><aside class="summary"><p class="eyebrow">ALIGN Membership</p><div class="level">${ESC(member.level)}</div><div class="meta"><span>${ESC(member.memberCode)}</span><span>${master?'Master access':'Registro activo'}</span></div><button class="mini" id="viewCard">Ver tarjeta</button></aside></div></section><section class="section light"><div class="section-head"><div><p class="eyebrow">Explora ALIGN</p><h2>Elige una categoría.</h2></div><p>Entra a cada categoría para ver únicamente los aliados y beneficios relacionados.</p></div><div class="category-grid">${cats.map(c=>`<button class="category" data-cat="${c.id}" style="--bg:${c.bg}"><div class="category-copy"><h3>${c.n}</h3><span>${(c.count||c.a.length)?`${c.count||c.a.length} ${c.label||((c.count||c.a.length)===1?'aliado':'aliados')}`:'Próximamente'}</span></div></button>`).join('')}</div><div class="drawer" id="drawer"></div></section><section class="section activity"><div class="bottom"><div class="panel"><p class="eyebrow">Tu actividad ALIGN</p><h2>Cada experiencia suma.</h2><p>Las visitas y beneficios utilizados aparecerán aquí conforme los aliados los registren.</p></div><div class="panel"><p class="eyebrow">Monto ahorrado</p><strong>$${Number(member.savings||0).toLocaleString('es-MX',{minimumFractionDigits:2})}</strong><p>Ahorro acumulado con ALIGN.</p></div></div></section>`;document.querySelectorAll('.category').forEach(btn=>btn.onclick=()=>{const cat=cats.find(c=>c.id===btn.dataset.cat);if(cat.direct){location.assign(cat.direct);return}const d=document.querySelector('#drawer');d.className='drawer open';d.innerHTML=`<div class="drawer-top"><h3>${cat.n}</h3><button class="close-cat" id="closeCat">×</button></div>${cat.a.length?`<div class="ally-grid">${cat.a.map(id=>{const a=ALLIES[id];return`<article class="ally"><h4>${a.n}</h4><p>${a.o}</p><a href="${a.u}">Ver beneficio</a></article>`}).join('')}</div>`:`<div class="soon">Estamos cerrando aliados para esta categoría. Próximamente disponible.</div>`}`;document.querySelector('#closeCat').onclick=()=>d.className='drawer';d.scrollIntoView({behavior:'smooth',block:'nearest'})});const modal=document.querySelector('#cardModal');document.querySelector('#viewCard').onclick=()=>{document.querySelector('#modalLevel').textContent=member.level;document.querySelector('#modalCode').textContent=member.memberCode;document.querySelector('#memberName').textContent=member.name;document.querySelector('#memberPhoto').innerHTML=member.photoUrl?`<img src="${member.photoUrl}" alt="Foto de ${ESC(member.name)}">`:'<div style="display:grid;place-items:center;width:100%;height:100%;font:500 2rem Playfair Display,serif">A</div>';const qr=document.querySelector('#qr');qr.innerHTML='';const qrText=master?'ALIGN-MYTIME-UNIVERSAL':['ALIGNTEST',group.socioId||'',group.socioId?group.socioId+'-P'+(member.position||1):'',group.account?.username||'',member.name||'',planKey||'',member.level||'',member.memberCode||'',member.token||''].map(v=>encodeURIComponent(String(v))).join('|');new QRCode(qr,{text:qrText,width:112,height:112});modal.classList.add('open')};document.querySelector('#closeModal').onclick=()=>modal.classList.remove('open')}catch(e){document.querySelector('#app').innerHTML=`<section class="hero"><h1>No pudimos abrir tu membresía.</h1><p>${ESC(e.message)}</p></section>`}}document.querySelector('#logout').onclick=()=>{sessionStorage.removeItem('align_member_token');sessionStorage.removeItem('align_master_access');location.replace('login-github.html')};loadPortal();</script></body></html>
