<!doctype html>
<html lang="es-MX">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1119"><title>Mi membresía | ALIGN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{--paper:#f4f1eb;--ink:#090a0c;--navy:#13263f;--gold:#d9c6a5;--muted:#777b82;--line:rgba(255,255,255,.14)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--ink);color:var(--paper);font-family:"DM Sans",sans-serif}a{color:inherit;text-decoration:none}button{font:inherit}.nav{display:flex;justify-content:space-between;align-items:center;padding:20px 5vw;border-bottom:1px solid var(--line);background:#0b0d11}.brand{font:500 1.25rem "Playfair Display",serif;letter-spacing:.2em}.logout{border:0;background:none;color:#aaa;font:500 .68rem "DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.hero{padding:70px 5vw 62px;background:radial-gradient(circle at 82% 0,#24486f 0,transparent 36%),linear-gradient(145deg,#111820,#090a0c)}.eyebrow{margin:0 0 14px;font:500 .68rem "DM Mono",monospace;letter-spacing:.15em;text-transform:uppercase;color:#aeb4bd}.hero-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,.65fr);gap:48px;align-items:center}h1,h2,h3{font-family:"Playfair Display",serif;font-weight:500}.hero h1{max-width:820px;margin:0;font-size:clamp(3.4rem,7vw,6.7rem);line-height:.9;letter-spacing:-.055em}.hero-copy{max-width:600px;margin:24px 0 0;color:#c7c9cd;line-height:1.68}.summary-card{padding:30px;border:1px solid rgba(217,198,165,.36);background:linear-gradient(145deg,#17395f,#08131f);box-shadow:0 25px 60px rgba(0,0,0,.35)}.summary-card.black{background:linear-gradient(145deg,#29292b,#020202)}.level{margin:4px 0 20px;font:500 3.3rem "Playfair Display",serif}.meta{display:flex;justify-content:space-between;gap:15px;padding-top:17px;border-top:1px solid var(--line);font:500 .68rem "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase}.card-actions{margin-top:20px}.mini-btn,.cta{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:12px 16px;border:1px solid currentColor;background:transparent;color:inherit;font:600 .65rem "DM Mono",monospace;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;transition:.2s}.mini-btn:hover,.cta:hover{background:currentColor;color:#fff}.section{padding:76px 5vw}.section.light{background:var(--paper);color:var(--ink)}.section-head{display:flex;justify-content:space-between;align-items:end;gap:28px;margin-bottom:34px}.section h2{margin:0;font-size:clamp(2.6rem,5vw,4.8rem);line-height:.95;letter-spacing:-.045em}.section-head p{max-width:430px;margin:0;color:#666b71;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.benefit{min-height:330px;display:flex;flex-direction:column;padding:30px;border:1px solid rgba(9,10,12,.14);background:#fff;box-shadow:0 15px 45px rgba(22,24,28,.04)}.benefit h3{margin:0;font-size:clamp(1.7rem,2.4vw,2.35rem);line-height:1.02}.benefit p{margin:18px 0;color:#555b61;line-height:1.6}.benefit-footer{margin-top:auto;padding-top:22px;border-top:1px solid rgba(9,10,12,.11)}.pill{display:block;margin-bottom:13px;font:500 .61rem "DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#71767d}.benefit .cta{color:#111;border-color:#111}.benefit .cta:hover{background:#111;color:#fff}.activity{background:#0d1117}.bottom-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:stretch}.activity-copy{padding:38px;border:1px solid var(--line);background:linear-gradient(145deg,#111820,#0a0d12)}.activity-copy h2{margin:0}.activity-copy p:last-child{max-width:620px;color:#aeb4bd;line-height:1.65}.savings{padding:38px;background:linear-gradient(145deg,#1e2631,#10151d);border:1px solid rgba(217,198,165,.25)}.savings strong{display:block;margin-top:10px;font:500 clamp(3.6rem,7vw,6.5rem)/.95 "Playfair Display",serif;color:var(--gold)}.savings p:last-child{color:#aeb4bd;line-height:1.55}.modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:22px;background:rgba(0,0,0,.82);backdrop-filter:blur(16px)}.modal.open{display:grid}.digital-card{position:relative;width:min(100%,760px);min-height:430px;overflow:hidden;padding:32px;background:radial-gradient(circle at 82% 10%,rgba(255,255,255,.11),transparent 28%),linear-gradient(145deg,#202124,#020202 72%);border:1px solid rgba(217,198,165,.5);box-shadow:0 40px 120px rgba(0,0,0,.7)}.digital-card:before{content:"";position:absolute;inset:auto -8% -45% 32%;height:390px;border:1px solid rgba(217,198,165,.13);border-radius:50%;transform:rotate(-8deg)}.card-top{position:relative;z-index:1;display:flex;justify-content:space-between;gap:24px;align-items:flex-start}.align-lockup{display:flex;align-items:center;gap:14px}.align-logo{width:58px;height:58px;display:grid;place-items:center;border:1px solid rgba(217,198,165,.7);border-radius:50%;font:500 2rem "Playfair Display",serif;color:var(--gold)}.align-word{font:500 1rem "DM Mono",monospace;letter-spacing:.18em}.member-photo{width:112px;height:112px;border:1px solid rgba(217,198,165,.55);display:grid;place-items:center;background:#d9c6a5;color:#101010;font:600 2rem "Playfair Display",serif;overflow:hidden}.member-photo img{width:100%;height:100%;object-fit:cover}.card-body{position:relative;z-index:1;display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end;margin-top:44px}.member-name{margin:0 0 8px;color:#bbb;font:500 .68rem "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase}.digital-level{margin:0;font:500 clamp(3.4rem,7vw,6.2rem)/.9 "Playfair Display",serif}.digital-meta{display:flex;gap:24px;margin-top:22px;font:500 .68rem "DM Mono",monospace;letter-spacing:.09em;text-transform:uppercase;color:#c8c8c8}.qr-panel{display:flex;align-items:end;gap:18px}.qr-copy{max-width:180px;color:#aaa;font-size:.78rem;line-height:1.5}.qr-box{padding:12px;background:#fff}.close{position:relative;z-index:1;width:100%;margin-top:28px;padding:13px;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;cursor:pointer}@media(max-width:900px){.hero-grid,.grid,.bottom-grid{grid-template-columns:1fr}.summary-card{margin-top:10px}.section-head{display:block}.section-head p{margin-top:14px}.benefit{min-height:280px}}@media(max-width:620px){.hero{padding:56px 6vw}.section{padding:62px 6vw}.card-top,.card-body{display:block}.member-photo{margin-top:24px}.qr-panel{margin-top:28px;align-items:flex-start}.digital-meta{flex-direction:column;gap:8px}.grid{gap:14px}}
</style></head>
<body>
<nav class="nav"><a class="brand" href="./">ALIGN</a><button class="logout" id="logout">Cerrar sesión</button></nav>
<main id="app"></main>
<div class="modal" id="cardModal" aria-hidden="true"><section class="digital-card"><div class="card-top"><div class="align-lockup"><div class="align-logo">A</div><div><div class="align-word">ALIGN</div><p class="eyebrow" style="margin:5px 0 0">Membership</p></div></div><div class="member-photo" id="memberPhoto">A</div></div><div class="card-body"><div><p class="member-name" id="memberName">Miembro ALIGN</p><h2 class="digital-level" id="modalLevel"></h2><div class="digital-meta"><span id="modalCode"></span><span>Activa</span><span>Titular</span></div></div><div class="qr-panel"><p class="qr-copy">Presenta esta tarjeta con el aliado. El QR valida tu membresía y registra el beneficio.</p><div class="qr-box" id="qr"></div></div></div><button class="close" id="closeModal">Cerrar tarjeta</button></section></div>
<script>
const qs=new URLSearchParams(location.search);const code=qs.get('member')||sessionStorage.getItem('align_member_code');const level=qs.get('level')||sessionStorage.getItem('align_member_level')||'Society';if(!code){location.replace('login.html')}sessionStorage.setItem('align_member_code',code);sessionStorage.setItem('align_member_level',level);const black=level==='Black';const savings=Number(localStorage.getItem(`align_savings_${code}`)||0);const memberName=qs.get('name')||localStorage.getItem(`align_member_name_${code}`)||localStorage.getItem('align_member_name')||'Miembro ALIGN';const photo=qs.get('photo')||localStorage.getItem(`align_member_photo_${code}`)||localStorage.getItem('align_member_photo')||sessionStorage.getItem('align_member_photo')||'';const benefits=black?[{n:'Marea Baja Surfing School',o:'2×1 permanente en clases de surf en Playa Miramar.',u:'marea-baja.html',b:'Ver Marea Baja'},{n:'Vaca Fishing',o:'Precio preferencial y sexta hora gratis después de cinco horas.',u:'dia-de-pesca.html',b:'Ver Vaca Fishing'},{n:'NUVA Pilates Studio',o:'Inscripción gratis al activar tu experiencia en NUVA.',u:'nuva.html',b:'Ver NUVA'},{n:'Experiencias ALIGN',o:'Acceso prioritario a eventos, activaciones y beneficios Black.',u:'experiencias-align.html',b:'Ver experiencias'}]:[{n:'Marea Baja Surfing School',o:'Cada clase baja de $350 a $250 MXN.',u:'marea-baja.html',b:'Ver Marea Baja'},{n:'NUVA Pilates Studio',o:'10% de descuento en dos visitas mensuales.',u:'nuva.html',b:'Ver NUVA'},{n:'Experiencias ALIGN',o:'Acceso a beneficios y eventos seleccionados para Society.',u:'experiencias-align.html',b:'Ver experiencias'},{n:'Aliados seleccionados',o:'Promociones individuales al presentar tu membresía.',u:'#',b:'Próximamente'}];document.querySelector('#app').innerHTML=`<section class="hero"><div class="hero-grid"><div><p class="eyebrow">Mi portal ALIGN</p><h1>Tu membresía ya está activa.</h1><p class="hero-copy">Consulta tus beneficios actuales, abre tu tarjeta digital y presenta tu QR con cada aliado participante.</p></div><aside class="summary-card ${black?'black':''}"><p class="eyebrow">ALIGN Membership</p><div class="level">${level}</div><div class="meta"><span>${code}</span><span>Activa</span></div><div class="card-actions"><button class="mini-btn" id="viewCard">Ver tarjeta digital</button></div></aside></div></section><section class="section light"><div class="section-head"><div><p class="eyebrow">Beneficios disponibles</p><h2>Vive la ciudad diferente.</h2></div><p>Entra a cada experiencia para conocer todos los detalles, reservar y utilizar el beneficio de tu membresía.</p></div><div class="grid">${benefits.map(b=>`<article class="benefit"><h3>${b.n}</h3><p>${b.o}</p><div class="benefit-footer"><span class="pill">Beneficio activo</span><a class="cta" href="${b.u}${b.u==='#'?'':`?member=${encodeURIComponent(code)}&level=${encodeURIComponent(level)}`}">${b.b}</a></div></article>`).join('')}</div></section><section class="section activity"><div class="bottom-grid"><div class="activity-copy"><p class="eyebrow">Tu actividad ALIGN</p><h2>Cada experiencia suma.</h2><p>Aquí aparecerán tus visitas, reservaciones y beneficios utilizados conforme se registren desde el sistema de aliados.</p></div><aside class="savings"><p class="eyebrow">Monto ahorrado</p><strong>$${savings.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})}</strong><p>Ahorro acumulado con tu membresía ALIGN.</p></aside></div></section>`;
const modal=document.querySelector('#cardModal');document.querySelector('#modalLevel').textContent=level;document.querySelector('#modalCode').textContent=code;document.querySelector('#memberName').textContent=memberName;if(photo){document.querySelector('#memberPhoto').innerHTML=`<img src="${photo}" alt="Foto del miembro">`}document.querySelector('#viewCard').onclick=()=>{modal.classList.add('open');modal.setAttribute('aria-hidden','false');if(!document.querySelector('#qr canvas')&&!document.querySelector('#qr img'))new QRCode(document.querySelector('#qr'),{text:`ALIGN|${code}|${level}`,width:154,height:154})};document.querySelector('#closeModal').onclick=()=>{modal.classList.remove('open');modal.setAttribute('aria-hidden','true')};modal.onclick=e=>{if(e.target===modal)document.querySelector('#closeModal').click()};document.querySelector('#logout').onclick=()=>{sessionStorage.removeItem('align_member_code');sessionStorage.removeItem('align_member_level');location.replace('login.html')};
</script></body></html>
