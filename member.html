<!doctype html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10233e">
<title>Mi tarjeta | ALIGN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f2efe9;--navy:#10233e;--champagne:#d9c6a5;--soft:#f0ede7;--ink:#152033;--muted:#716e68}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:start center;padding:30px 18px 54px;background:radial-gradient(circle at 50% 0,#fff 0,var(--paper) 42%,#e9e4dc 100%);color:var(--paper);font-family:"DM Sans",sans-serif}main{width:min(100%,438px)}.selector{margin:0 0 16px;padding:16px;border:1px solid rgba(16,35,62,.14);border-radius:20px;background:rgba(255,255,255,.72);box-shadow:0 14px 34px rgba(16,35,62,.1);color:var(--navy);backdrop-filter:blur(12px)}.selector[hidden]{display:none}.selector-kicker{margin:0 0 5px;font-family:"DM Mono",monospace;font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;color:#77736c}.selector-title{margin:0 0 12px;font-family:"Bodoni Moda",serif;font-size:1.45rem;font-weight:600;letter-spacing:-.025em}.selector-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}.selector.family .selector-grid{grid-template-columns:1fr}.member-option{min-width:0;padding:9px;border:1px solid rgba(16,35,62,.16);border-radius:14px;background:#faf8f4;color:var(--navy);display:flex;align-items:center;gap:9px;text-align:left;cursor:pointer;transition:.18s ease}.selector.family .member-option{padding:10px 12px}.member-option:hover{transform:translateY(-1px);border-color:rgba(16,35,62,.35)}.member-option.active{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 8px 18px rgba(16,35,62,.2)}.option-photo{width:43px;height:43px;flex:0 0 43px;border-radius:11px;overflow:hidden;display:grid;place-items:center;background:#ded6c7;color:var(--navy);font-family:"Bodoni Moda",serif;font-size:1.15rem}.member-option.active .option-photo{outline:1px solid rgba(217,198,165,.7)}.option-photo img{display:block;width:100%;height:100%;object-fit:cover}.option-copy{min-width:0}.option-role{display:block;margin-bottom:2px;font-family:"DM Mono",monospace;font-size:.51rem;letter-spacing:.1em;text-transform:uppercase;opacity:.68}.option-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.78rem;font-weight:600}.card{position:relative;isolation:isolate;min-height:760px;overflow:hidden;padding:28px 29px 25px;display:flex;flex-direction:column;border:1px solid rgba(179,201,225,.3);border-radius:28px;background:linear-gradient(138deg,#24466c 0%,#10233e 35%,#071426 100%);box-shadow:0 34px 75px rgba(9,21,37,.42),inset 0 1px rgba(255,255,255,.12),inset 0 0 55px rgba(0,0,0,.34)}.card::after{content:"";position:absolute;z-index:-1;inset:10px;border:1px solid rgba(217,198,165,.13);border-radius:20px;pointer-events:none}.top,.bottom{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.top{position:relative;min-height:76px}.logo{width:138px;height:auto;object-fit:contain}.eyebrow,.status{margin:0;font-family:"DM Mono",monospace;font-size:.63rem;letter-spacing:.16em;text-transform:uppercase}.status{position:absolute;right:0;top:2px;padding:7px 10px;border:1px solid rgba(217,198,165,.46);border-radius:999px;color:var(--champagne);background:rgba(217,198,165,.06)}.level{margin:20px 0 0;font-family:"Bodoni Moda",serif;font-size:3.55rem;font-weight:500;line-height:.9;letter-spacing:-.06em;color:#f6f3ee}.member-label{margin:23px 0 0;font-family:"DM Mono",monospace;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase}.member{margin:6px 0 0;font-size:1.35rem;font-weight:500;color:var(--soft)}.identity{margin-top:24px;display:grid;justify-items:center;gap:14px}.profile{width:148px;height:148px;object-fit:cover;border-radius:22px;border:3px solid var(--champagne);box-shadow:0 16px 34px rgba(0,0,0,.42)}.identity-label{margin:0;color:var(--champagne);font-family:"DM Mono",monospace;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase}.qr-area{margin-top:20px;display:grid;justify-items:center;gap:13px}.qr-wrap{width:166px;height:166px;padding:10px;background:#faf8f4;border:4px solid rgba(217,198,165,.86);border-radius:14px}.qr-wrap img{display:block;width:100%;height:100%}.caption{max-width:300px;margin:0;text-align:center;color:rgba(231,225,214,.78);font-size:.7rem;line-height:1.55}.period{display:block;margin-top:8px;color:var(--champagne);font-family:"DM Mono",monospace;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase}.bottom{margin-top:18px;padding-top:15px;border-top:1px solid rgba(217,198,165,.38)}.bottom>div:last-child{text-align:right}.code{margin:7px 0 0;font-family:"DM Mono",monospace;font-size:.88rem;letter-spacing:.1em}.saving{margin:7px 0 0;color:var(--champagne);font-family:"Bodoni Moda",serif;font-size:1.26rem}.load{min-height:626px;display:grid;place-items:center;border-radius:28px;background:var(--navy);font-family:"Bodoni Moda",serif;font-size:1.55rem}.error{background:#16171a;text-align:center;padding:36px;color:#fff}.hint{margin:18px 8px 0;color:#68645e;text-align:center;font-size:.76rem;line-height:1.5}.activity{margin-top:22px;padding:22px;border:1px solid rgba(16,35,62,.13);border-radius:24px;background:rgba(255,255,255,.82);box-shadow:0 18px 42px rgba(16,35,62,.1);color:var(--ink)}.activity.loading{min-height:170px;display:grid;place-items:center;color:var(--muted)}.activity-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:16px}.activity-kicker{margin:0 0 4px;font:500 .57rem "DM Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#7c7770}.activity-title{margin:0;font:600 1.85rem/1 "Bodoni Moda",serif;letter-spacing:-.035em}.activity-person{margin:0;max-width:150px;text-align:right;font-size:.68rem;color:#777}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:13px 10px;border:1px solid rgba(16,35,62,.1);border-radius:14px;background:#f8f5ef}.stat-label{display:block;margin-bottom:5px;font:500 .5rem "DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#777}.stat-value{display:block;font:600 1.2rem "Bodoni Moda",serif;color:var(--navy)}.favorite{margin-top:12px;padding:14px;border-radius:14px;background:var(--navy);color:#fff}.favorite-label{display:block;margin-bottom:4px;font:500 .5rem "DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--champagne)}.favorite-name{font:600 1.25rem "Bodoni Moda",serif}.favorite-meta{margin:4px 0 0;font-size:.68rem;color:#c9d0da}.history-title{margin:20px 0 9px;font:600 1.15rem "Bodoni Moda",serif;color:var(--navy)}.visit-list{display:grid;gap:8px}.visit{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-top:1px solid rgba(16,35,62,.1)}.visit:first-child{border-top:0}.visit-place{font-size:.8rem;font-weight:600;color:var(--navy)}.visit-date,.visit-benefit{margin-top:3px;font-size:.62rem;color:#777;line-height:1.4}.visit-money{text-align:right}.visit-spent{display:block;font-size:.78rem;font-weight:600;color:var(--navy)}.visit-saved{display:block;margin-top:3px;font-size:.61rem;color:#6f7f5e}.empty{padding:18px 4px 4px;color:#777;text-align:center;font-size:.75rem;line-height:1.5}.activity-error{color:#8c3f3f;text-align:center;font-size:.75rem}@media(max-width:390px){.selector{padding:13px}.selector:not(.family) .selector-grid{grid-template-columns:1fr 1fr}.member-option{padding:8px 7px;gap:7px}.selector.family .member-option{padding:9px}.option-photo{width:37px;height:37px;flex-basis:37px}.option-name{font-size:.7rem}.card{min-height:730px;padding:24px}.level{font-size:3.2rem}.profile{width:132px;height:132px}.qr-wrap{width:154px;height:154px}.activity{padding:17px}.stat{padding:11px 7px}.stat-value{font-size:1.05rem}.activity-person{display:none}}
</style>
<link rel="icon" type="image/png" href="assets/align-primary.png?v=transparent-5">
</head>
<body>
<main>
<section id="cardSelector" class="selector" hidden></section>
<section id="app" class="load">Cargando tu tarjeta…</section>
<p class="hint">El QR se renueva con cada mensualidad pagada. El aliado debe verificar nombre, membresía, fotografía y vigencia.</p>
<section id="activityPanel" class="activity loading">Cargando tu actividad…</section>
</main>
<script>
const API='https://api.alignmembers.com.mx/api';
const app=document.querySelector('#app'),selector=document.querySelector('#cardSelector'),activityPanel=document.querySelector('#activityPanel'),params=new URLSearchParams(location.search),rootToken=params.get('token')||sessionStorage.getItem('align_member_token');
if(rootToken)sessionStorage.setItem('align_member_token',rootToken);
let activeToken=rootToken,groupCards=[];
const money=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]);
const dateLabel=iso=>{const date=new Date(iso);return Number.isNaN(date.getTime())?'':new Intl.DateTimeFormat('es-MX',{day:'numeric',month:'short',year:'numeric',timeZone:'America/Monterrey'}).format(date)};
const visitDateLabel=iso=>{const date=new Date(iso);return Number.isNaN(date.getTime())?'':new Intl.DateTimeFormat('es-MX',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit',timeZone:'America/Monterrey'}).format(date)};
const validityLabel=(from,until)=>`${dateLabel(from)} — ${dateLabel(until)}`;
const initials=name=>String(name||'A').trim().split(/\s+/).slice(0,2).map(part=>part.charAt(0)).join('').toUpperCase()||'A';
const roleLabel=position=>Number(position)===1?'Titular':`Integrante ${Number(position)||2}`;
function showError(message='Tarjeta no disponible'){app.className='card error';app.innerHTML=`<div><p class="eyebrow">ALIGN</p><h1>${escapeHtml(message)}</h1><p class="caption">Revisa que el enlace esté completo o contacta a ALIGN.</p></div>`}
function renderSelector(){
  if(groupCards.length<2){selector.hidden=true;selector.innerHTML='';selector.classList.remove('family');return}
  const isFamily=groupCards.length===3;
  selector.hidden=false;
  selector.classList.toggle('family',isFamily);
  selector.innerHTML=`<p class="selector-kicker">${isFamily?'Familiar · 3 tarjetas':'Dúo · 2 tarjetas'}</p><h2 class="selector-title">Elige qué tarjeta vas a usar</h2><div class="selector-grid">${groupCards.map(card=>`<button type="button" class="member-option${card.token===activeToken?' active':''}" data-token="${escapeHtml(card.token)}" aria-pressed="${card.token===activeToken?'true':'false'}"><span class="option-photo">${card.photoUrl?`<img decoding="async" src="${escapeHtml(card.photoUrl)}" alt="">`:escapeHtml(initials(card.name))}</span><span class="option-copy"><span class="option-role">${escapeHtml(roleLabel(card.position))}</span><span class="option-name">${escapeHtml(card.name)}</span></span></button>`).join('')}</div>`;
  selector.querySelectorAll('[data-token]').forEach(button=>button.addEventListener('click',()=>selectCard(button.dataset.token)));
}
async function fetchJson(url){const response=await fetch(url,{cache:'no-store'}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'No fue posible cargar la tarjeta.');return data}
async function renderCard(member,memberToken){
  const qrData=await fetchJson(`${API}/monthly-qr?token=${encodeURIComponent(memberToken)}`);
  if(!qrData.validationUrl)throw new Error('No se pudo generar el QR.');
  app.className='card';
  app.innerHTML=`<div class="top"><img decoding="async" class="logo" src="assets/align-wordmark.png?v=transparent-5" alt="ALIGN"><p class="status">${escapeHtml(member.status||'Activa')}</p></div><div><h1 class="level">${escapeHtml(member.level)}</h1><p class="member-label">Miembro ALIGN</p><p class="member">${escapeHtml(member.name)}</p></div><div class="identity"><img decoding="async" class="profile" src="${escapeHtml(member.photoUrl)}" alt="Foto de ${escapeHtml(member.name)}"><p class="identity-label">Verifica que sea la misma persona</p></div><div class="qr-area"><div class="qr-wrap"><img decoding="async" id="qr" alt="Código QR de la mensualidad vigente"></div><p class="caption">Presenta este código al aliado. Al escanearlo verá tus datos oficiales y podrá confirmar tu identidad.<span class="period">Vigencia: ${escapeHtml(validityLabel(qrData.validFrom,qrData.validUntil))}</span></p></div><div class="bottom"><div><p class="eyebrow">Código de socio</p><p class="code">${escapeHtml(member.memberCode)}</p></div><div><p class="eyebrow">Ahorro</p><p class="saving">${money.format(member.savings||0)}</p></div></div>`;
  document.querySelector('#qr').src=`https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=0&data=${encodeURIComponent(qrData.validationUrl)}`;
}
function renderActivity(data){
  const activity=data?.activity||{},favorite=activity.favoritePlaces?.[0],visits=activity.recentVisits||[];
  activityPanel.className='activity';
  activityPanel.innerHTML=`<div class="activity-head"><div><p class="activity-kicker">Tu actividad ALIGN</p><h2 class="activity-title">Tus números</h2></div><p class="activity-person">${escapeHtml(data?.member?.name||'')}</p></div><div class="stats"><div class="stat"><span class="stat-label">Visitas</span><span class="stat-value">${Number(activity.visits||0)}</span></div><div class="stat"><span class="stat-label">Gastado</span><span class="stat-value">${money.format(activity.spent||0)}</span></div><div class="stat"><span class="stat-label">Ahorrado</span><span class="stat-value">${money.format(activity.savings||0)}</span></div></div>${favorite?`<div class="favorite"><span class="favorite-label">Tu lugar más frecuente</span><div class="favorite-name">${escapeHtml(favorite.place)}</div><p class="favorite-meta">${Number(favorite.visits||0)} visita${Number(favorite.visits||0)===1?'':'s'} · ${money.format(favorite.savings||0)} ahorrados</p></div>`:''}<h3 class="history-title">Actividad reciente</h3>${visits.length?`<div class="visit-list">${visits.map(visit=>`<div class="visit"><div><div class="visit-place">${escapeHtml(visit.place)}</div><div class="visit-date">${escapeHtml(visitDateLabel(visit.createdAt))}</div>${visit.benefit?`<div class="visit-benefit">${escapeHtml(visit.benefit)}</div>`:''}</div><div class="visit-money"><span class="visit-spent">${money.format(visit.spent||0)}</span><span class="visit-saved">+${money.format(visit.saved||0)} ahorro</span></div></div>`).join('')}</div>`:`<div class="empty">Todavía no hay visitas registradas con esta tarjeta. Tu historial aparecerá aquí después de usar un beneficio.</div>`}`;
}
async function loadActivity(memberToken){
  activityPanel.className='activity loading';activityPanel.textContent='Cargando tu actividad…';
  try{const data=await fetchJson(`${API}/member-activity?token=${encodeURIComponent(memberToken)}`);if(memberToken!==activeToken)return;renderActivity(data)}catch(error){if(memberToken!==activeToken)return;activityPanel.className='activity';activityPanel.innerHTML=`<p class="activity-error">${escapeHtml(error.message)}</p>`}
}
async function selectCard(memberToken){
  if(!memberToken||!groupCards.some(card=>card.token===memberToken))return;
  activeToken=memberToken;
  sessionStorage.setItem('align_selected_member_token',activeToken);
  renderSelector();
  app.className='load';app.textContent='Cargando tu tarjeta…';
  activityPanel.className='activity loading';activityPanel.textContent='Cargando tu actividad…';
  try{
    const member=await fetchJson(`${API}/member-card?token=${encodeURIComponent(activeToken)}`);
    if(!member.active)throw new Error('La membresía no está vigente.');
    if(member.needsPhoto){location.assign(`profile-photo.html?token=${encodeURIComponent(activeToken)}`);return}
    await renderCard(member,activeToken);
    loadActivity(activeToken);
  }catch(error){showError(error.message);activityPanel.className='activity';activityPanel.innerHTML='<p class="activity-error">Actividad no disponible.</p>'}
}
async function loadCard(){
  try{
    if(!rootToken||!/^[A-Za-z0-9_-]{20,}$/.test(rootToken))throw new Error('Enlace de tarjeta no válido.');
    try{
      const group=await fetchJson(`${API}/group-cards?token=${encodeURIComponent(rootToken)}`);
      groupCards=Array.isArray(group.cards)&&group.cards.length?group.cards:[];
    }catch(_){groupCards=[]}
    if(!groupCards.length){
      const member=await fetchJson(`${API}/member-card?token=${encodeURIComponent(rootToken)}`);
      groupCards=[{token:rootToken,name:member.name,level:member.level,planKey:member.planKey,memberCode:member.memberCode,status:member.status,position:1,photoUrl:member.photoUrl||'',savings:Number(member.savings||0)}];
    }
    const remembered=sessionStorage.getItem('align_selected_member_token');
    activeToken=groupCards.some(card=>card.token===remembered)?remembered:(groupCards.find(card=>Number(card.position)===1)?.token||groupCards[0].token);
    renderSelector();
    await selectCard(activeToken);
  }catch(error){showError(error.message);activityPanel.className='activity';activityPanel.innerHTML='<p class="activity-error">Actividad no disponible.</p>'}
}
loadCard();
</script>
</body>
</html>
