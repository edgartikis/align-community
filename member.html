<!doctype html><html lang="es-MX"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10233e"><title>Mi tarjeta | ALIGN</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--paper:#f2efe9;--navy:#10233e;--champagne:#d9c6a5;--soft:#f0ede7}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:30px 18px;background:radial-gradient(circle at 50% 0,#fff 0,var(--paper) 42%,#e9e4dc 100%);color:var(--paper);font-family:"DM Sans",sans-serif}main{width:min(100%,438px)}.card{position:relative;isolation:isolate;min-height:760px;overflow:hidden;padding:28px 29px 25px;display:flex;flex-direction:column;border:1px solid rgba(179,201,225,.3);border-radius:28px;background:linear-gradient(138deg,#24466c 0%,#10233e 35%,#071426 100%);box-shadow:0 34px 75px rgba(9,21,37,.42),inset 0 1px rgba(255,255,255,.12),inset 0 0 55px rgba(0,0,0,.34)}.card::after{content:"";position:absolute;z-index:-1;inset:10px;border:1px solid rgba(217,198,165,.13);border-radius:20px;pointer-events:none}.top,.bottom{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.top{position:relative;min-height:76px}.logo{width:138px;height:auto;object-fit:contain}.eyebrow,.status{margin:0;font-family:"DM Mono",monospace;font-size:.63rem;letter-spacing:.16em;text-transform:uppercase}.status{position:absolute;right:0;top:2px;padding:7px 10px;border:1px solid rgba(217,198,165,.46);border-radius:999px;color:var(--champagne);background:rgba(217,198,165,.06)}.level{margin:20px 0 0;font-family:"Bodoni Moda",serif;font-size:3.55rem;font-weight:500;line-height:.9;letter-spacing:-.06em;color:#f6f3ee}.member-label{margin:23px 0 0;font-family:"DM Mono",monospace;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase}.member{margin:6px 0 0;font-size:1.35rem;font-weight:500;color:var(--soft)}.identity{margin-top:24px;display:grid;justify-items:center;gap:14px}.profile{width:148px;height:148px;object-fit:cover;border-radius:22px;border:3px solid var(--champagne);box-shadow:0 16px 34px rgba(0,0,0,.42)}.identity-label{margin:0;color:var(--champagne);font-family:"DM Mono",monospace;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase}.qr-area{margin-top:20px;display:grid;justify-items:center;gap:13px}.qr-wrap{width:166px;height:166px;padding:10px;background:#faf8f4;border:4px solid rgba(217,198,165,.86);border-radius:14px}.qr-wrap img{display:block;width:100%;height:100%}.caption{max-width:300px;margin:0;text-align:center;color:rgba(231,225,214,.78);font-size:.7rem;line-height:1.55}.period{display:block;margin-top:8px;color:var(--champagne);font-family:"DM Mono",monospace;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase}.bottom{margin-top:18px;padding-top:15px;border-top:1px solid rgba(217,198,165,.38)}.bottom>div:last-child{text-align:right}.code{margin:7px 0 0;font-family:"DM Mono",monospace;font-size:.88rem;letter-spacing:.1em}.saving{margin:7px 0 0;color:var(--champagne);font-family:"Bodoni Moda",serif;font-size:1.26rem}.load{min-height:626px;display:grid;place-items:center;border-radius:28px;background:var(--navy);font-family:"Bodoni Moda",serif;font-size:1.55rem}.error{background:#16171a;text-align:center;padding:36px;color:#fff}.hint{margin:18px 8px 0;color:#68645e;text-align:center;font-size:.76rem;line-height:1.5}@media(max-width:390px){.card{min-height:730px;padding:24px}.level{font-size:3.2rem}.profile{width:132px;height:132px}.qr-wrap{width:154px;height:154px}}
</style><link rel="icon" type="image/png" href="assets/align-primary.png?v=transparent-5"></head><body><main><section id="app" class="load">Cargando tu tarjeta…</section><p class="hint">El QR se renueva con cada mensualidad pagada. El aliado debe verificar nombre, membresía, fotografía y vigencia.</p></main><script>
const API='https://api.alignmembers.com.mx/api';
const app=document.querySelector('#app'),params=new URLSearchParams(location.search),token=params.get('token')||sessionStorage.getItem('align_member_token');if(token)sessionStorage.setItem('align_member_token',token);
const money=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]);
const dateLabel=iso=>{const date=new Date(iso);return Number.isNaN(date.getTime())?'':new Intl.DateTimeFormat('es-MX',{day:'numeric',month:'short',year:'numeric',timeZone:'America/Monterrey'}).format(date)};
const validityLabel=(from,until)=>`${dateLabel(from)} — ${dateLabel(until)}`;
function showError(message='Tarjeta no disponible'){app.className='card error';app.innerHTML=`<div><p class="eyebrow">ALIGN</p><h1>${escapeHtml(message)}</h1><p class="caption">Revisa que el enlace esté completo o contacta a ALIGN.</p></div>`}
async function renderCard(member){const qrResponse=await fetch(`${API}/monthly-qr?token=${encodeURIComponent(token)}`,{cache:'no-store'}),qrData=await qrResponse.json();if(!qrResponse.ok||!qrData.validationUrl)throw new Error(qrData.error||'No se pudo generar el QR.');app.className='card';app.innerHTML=`<div class="top"><img class="logo" src="assets/align-wordmark.png?v=transparent-5" alt="ALIGN"><p class="status">${escapeHtml(member.status||'Activa')}</p></div><div><h1 class="level">${escapeHtml(member.level)}</h1><p class="member-label">Miembro ALIGN</p><p class="member">${escapeHtml(member.name)}</p></div><div class="identity"><img class="profile" src="${member.photoUrl}" alt="Foto de ${escapeHtml(member.name)}"><p class="identity-label">Verifica que sea la misma persona</p></div><div class="qr-area"><div class="qr-wrap"><img id="qr" alt="Código QR de la mensualidad vigente"></div><p class="caption">Presenta este código al aliado. Al escanearlo verá tus datos oficiales y podrá confirmar tu identidad.<span class="period">Vigencia: ${escapeHtml(validityLabel(qrData.validFrom,qrData.validUntil))}</span></p></div><div class="bottom"><div><p class="eyebrow">Código de socio</p><p class="code">${escapeHtml(member.memberCode)}</p></div><div><p class="eyebrow">Ahorro</p><p class="saving">${money.format(member.savings||0)}</p></div></div>`;document.querySelector('#qr').src=`https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=0&data=${encodeURIComponent(qrData.validationUrl)}`}
async function loadCard(){try{if(!token||!/^[A-Za-z0-9_-]{20,}$/.test(token))throw new Error('Enlace de tarjeta no válido.');const response=await fetch(`${API}/member-card?token=${encodeURIComponent(token)}`,{cache:'no-store'}),member=await response.json();if(!response.ok)throw new Error(member.error||'Tarjeta no disponible.');if(!member.active)throw new Error('La membresía no está vigente.');if(member.needsPhoto){location.replace(`profile-photo.html?token=${encodeURIComponent(token)}`);return}await renderCard(member)}catch(error){showError(error.message)}}loadCard();
</script></body></html>
