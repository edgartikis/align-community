<!doctype html><html lang="es-MX"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0c"><title>Activando membresía | ALIGN</title><style>
*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#090a0c;color:#f5f2ec;font-family:Arial,sans-serif;text-align:center}.panel{width:min(100%,620px);padding:46px 30px;border:1px solid rgba(255,255,255,.2);background:linear-gradient(145deg,#172a45,#080b10)}.mark{width:58px;height:58px;margin:0 auto 24px;display:grid;place-items:center;border:1px solid #f5f2ec;border-radius:50%;font-family:Georgia,serif;font-size:30px}h1{margin:0;font-family:Georgia,serif;font-weight:400;font-size:clamp(34px,8vw,55px);line-height:1}p{margin:20px auto 0;max-width:440px;color:#cbc7be;line-height:1.6}.loader{width:34px;height:34px;margin:26px auto 0;border:2px solid rgba(255,255,255,.22);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}.button{display:none;margin-top:25px;padding:13px 18px;border:1px solid #fff;background:transparent;color:#fff;text-transform:uppercase;font-size:12px;letter-spacing:.1em;cursor:pointer}.member-list{display:grid;gap:10px;margin-top:25px}.member-link{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:15px;border:1px solid rgba(255,255,255,.22);color:#fff;text-decoration:none;text-align:left}.member-link strong{display:block}.member-link span{font-family:monospace;color:#d9c6a5;font-size:12px}@keyframes spin{to{transform:rotate(360deg)}}
</style>
<link rel="icon" type="image/png" href="assets/align-primary.png?v=transparent-3">
<style id="align-official-brand">
.align-logo-link,.align-logo-block{display:inline-flex!important;align-items:center!important;font-size:0!important;letter-spacing:0!important;line-height:1!important}
.align-wordmark-logo{display:block;width:clamp(118px,14vw,158px);height:auto;max-width:42vw;object-fit:contain}
.align-symbol-logo{display:flex!important;align-items:center!important;justify-content:center!important;font-size:0!important;border:0!important;border-radius:0!important;background:transparent!important;overflow:visible!important}
.align-symbol-logo .align-primary-logo{display:block;width:auto;height:100%;max-width:100%;object-fit:contain}
.gate-mark.align-symbol-logo{width:84px;height:114px;margin-left:auto;margin-right:auto}
.mark.align-symbol-logo{width:68px;height:92px;margin-left:auto;margin-right:auto}
.empty-mark.align-symbol-logo{width:82px;height:112px;margin-left:auto;margin-right:auto}
.logo.align-card-logo{display:block;width:138px;height:auto;object-fit:contain}
@media(max-width:600px){.align-wordmark-logo{width:124px}.gate-mark.align-symbol-logo{width:70px;height:96px}}
</style>
</head><body><main class="panel"><div class="mark align-symbol-logo"><img class="align-primary-logo" src="assets/align-primary.png?v=transparent-3" alt="ALIGN"></div><h1 id="title">Pago aceptado.</h1><p id="message">Estamos activando tu membresía y preparando las tarjetas.</p><div id="loader" class="loader"></div><div id="member-list" class="member-list"></div><button id="retry" class="button" type="button">Intentar de nuevo</button></main><script>
const title=document.querySelector('#title'),message=document.querySelector('#message'),loader=document.querySelector('#loader'),retry=document.querySelector('#retry'),memberList=document.querySelector('#member-list'),sessionId=new URLSearchParams(location.search).get('session_id');let retryTimer;async function activate(attempt=0){clearTimeout(retryTimer);retry.style.display='none';loader.style.display='block';try{if(!sessionId)throw new Error('missing');const response=await fetch(`/.netlify/functions/activate-membership?session_id=${encodeURIComponent(sessionId)}`,{cache:'no-store'}),data=await response.json();if(response.status===202&&attempt<30){message.textContent='Confirmando tu pago y preparando las tarjetas personales.';retryTimer=setTimeout(()=>activate(attempt+1),1500);return}if(!response.ok||!Array.isArray(data.members)||!data.members.length)throw new Error(data.error||'failed');title.textContent=`Bienvenido a ALIGN ${data.level}.`;message.textContent=data.members.length===1?'Tu tarjeta y código ya están listos. Configura tu foto para protegerlos.':'Las tarjetas y códigos ya están listos. Cada integrante debe configurar su propia foto.';loader.style.display='none';memberList.innerHTML=data.members.map(member=>`<a class="member-link" href="/profile-photo.html?token=${encodeURIComponent(member.token)}"><strong>${member.name}</strong><span>${member.memberCode} →</span></a>`).join('')}catch(error){title.textContent='Pago recibido.';message.textContent='Tu pago fue recibido, pero las tarjetas todavía no pudieron abrirse. Intenta nuevamente en unos segundos.';loader.style.display='none';retry.style.display='inline-block'}}retry.addEventListener('click',()=>activate());activate();
</script></body></html>
