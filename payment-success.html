<!doctype html><html lang="es-MX"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0c"><title>Activando membresía | ALIGN</title><style>
*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#090a0c;color:#f5f2ec;font-family:Arial,sans-serif;text-align:center}.panel{width:min(100%,640px);padding:46px 30px;border:1px solid rgba(255,255,255,.2);background:linear-gradient(145deg,#172a45,#080b10)}.brand-logo{display:block;width:min(180px,44vw);height:auto;margin:0 auto 28px;object-fit:contain}h1{margin:0;font-family:Georgia,serif;font-weight:400;font-size:clamp(34px,8vw,55px);line-height:1}p{margin:20px auto 0;max-width:470px;color:#cbc7be;line-height:1.6}.loader{width:34px;height:34px;margin:26px auto 0;border:2px solid rgba(255,255,255,.22);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}.button{display:none;margin-top:25px;padding:13px 18px;border:1px solid #fff;background:transparent;color:#fff;text-transform:uppercase;font-size:12px;letter-spacing:.1em;cursor:pointer}.member-list{display:grid;gap:10px;margin-top:25px}.member-link{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:15px;border:1px solid rgba(255,255,255,.22);color:#fff;text-decoration:none;text-align:left;background:rgba(255,255,255,.02)}.member-link strong{display:block}.member-link span{font-family:monospace;color:#d9c6a5;font-size:12px}@keyframes spin{to{transform:rotate(360deg)}}
</style><link rel="icon" type="image/png" href="assets/align-primary.png?v=transparent-5"></head><body><main class="panel"><img class="brand-logo" src="image-gen-1(20260816-192750).png?v=20260816-192750" alt="ALIGN"><h1 id="title">Pago aceptado.</h1><p id="message">Estamos confirmando tu pago y preparando tu tarjeta digital.</p><div id="loader" class="loader"></div><div id="member-list" class="member-list"></div><button id="retry" class="button" type="button">Intentar de nuevo</button></main><script>
const API='https://api.alignmembers.com.mx/api/activate-membership';
const title=document.querySelector('#title'),message=document.querySelector('#message'),loader=document.querySelector('#loader'),retry=document.querySelector('#retry'),memberList=document.querySelector('#member-list'),sessionId=new URLSearchParams(location.search).get('session_id');let retryTimer;
async function activate(attempt=0){clearTimeout(retryTimer);retry.style.display='none';loader.style.display='block';memberList.innerHTML='';try{if(!sessionId)throw new Error('Sesión de pago no encontrada.');const response=await fetch(`${API}?session_id=${encodeURIComponent(sessionId)}`,{cache:'no-store'});const data=await response.json();if(response.status===202&&attempt<30){message.textContent='Confirmando tu pago con Stripe y preparando tu tarjeta personal.';retryTimer=setTimeout(()=>activate(attempt+1),1500);return}if(!response.ok||!Array.isArray(data.members)||!data.members.length)throw new Error(data.error||'No se pudo crear la tarjeta.');const members=data.members;localStorage.setItem('align_photo_queue',JSON.stringify(members.map(m=>({token:m.token,name:m.name,memberCode:m.memberCode}))));localStorage.setItem('align_primary_token',members[0].token);title.textContent=members.length===1?'Tu tarjeta está creada.':'Tus tarjetas están creadas.';message.textContent=members.length===1?'El pago quedó confirmado. Solo falta vincular tu foto para proteger tu tarjeta digital y QR.':'El pago quedó confirmado. Cada integrante debe vincular su foto antes de usar su tarjeta digital.';loader.style.display='none';memberList.innerHTML=members.map((member,index)=>`<a class="member-link" href="/profile-photo.html?token=${encodeURIComponent(member.token)}"><strong>${member.name}</strong><span>${index===0?'Configurar foto':'Configurar integrante'} · ${member.memberCode} →</span></a>`).join('')}catch(error){console.error('ALIGN activation:',error);title.textContent='Pago recibido.';message.textContent=error?.message||'Tu pago fue recibido, pero la tarjeta todavía no pudo abrirse. Intenta nuevamente en unos segundos.';loader.style.display='none';retry.style.display='inline-block'}}
retry.addEventListener('click',()=>activate());activate();
</script></body></html>
