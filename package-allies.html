<style>:root{--paper:#f4f1eb;--ink:#090a0c;--gold:#d9c6a5;--line:rgba(255,255,255,.14)}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--paper);font-family:"DM Sans",sans-serif}a{color:inherit;text-decoration:none}.nav{display:flex;justify-content:space-between;align-items:center;padding:22px 5vw;border-bottom:1px solid var(--line)}.brand{font:500 1.25rem "Playfair Display",serif;letter-spacing:.2em}.back{font:500 .68rem "DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#bbb}.hero{padding:92px 5vw 72px;background:radial-gradient(circle at 82% 0,#24486f 0,transparent 36%),linear-gradient(145deg,#111820,#090a0c)}.eyebrow{margin:0 0 14px;font:500 .68rem "DM Mono",monospace;letter-spacing:.15em;text-transform:uppercase;color:#8d9299}h1,h2,h3{font-family:"Playfair Display",serif;font-weight:500}.hero h1{max-width:900px;margin:0;font-size:clamp(3.6rem,8vw,7.4rem);line-height:.88;letter-spacing:-.06em}.hero p:last-child{max-width:590px;margin:28px 0 0;color:#c7c9cd;line-height:1.7}.section{padding:82px 5vw;background:var(--paper);color:var(--ink)}.section-head{display:flex;justify-content:space-between;align-items:end;gap:28px;margin-bottom:35px}.section h2{margin:0;font-size:clamp(2.6rem,5vw,4.8rem);line-height:.95;letter-spacing:-.045em}.section-head p{max-width:440px;margin:0;color:#666b71;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.ally{min-height:330px;display:flex;flex-direction:column;padding:30px;border:1px solid rgba(9,10,12,.14);background:#fff;box-shadow:0 15px 45px rgba(22,24,28,.04)}.ally.category{background:linear-gradient(145deg,#152b43,#0b1119);color:#f4f1eb;border-color:#c4a46b}.ally.category .eyebrow{color:#d1ba8f}.ally.category p{color:#ccd2d8}.ally.category .ally-footer{border-top-color:rgba(255,255,255,.16)}.ally.category .tag{color:#d1ba8f}.ally.category .cta{border-color:#f4f1eb;color:#f4f1eb}.ally.category .cta:hover{background:#f4f1eb;color:#0b1119}.ally h3{margin:0;font-size:clamp(1.9rem,2.8vw,2.7rem);line-height:1}.ally p{margin:18px 0;color:#555b61;line-height:1.6}.ally-footer{margin-top:auto;padding-top:22px;border-top:1px solid rgba(9,10,12,.11)}.tag{display:block;margin-bottom:14px;font:500 .61rem "DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#71767d}.cta{display:inline-flex;min-height:42px;align-items:center;padding:12px 16px;border:1px solid #111;font:600 .65rem "DM Mono",monospace;letter-spacing:.09em;text-transform:uppercase}.cta:hover{background:#111;color:#fff}.footer{padding:30px 5vw;display:flex;justify-content:space-between;gap:15px;color:#777;font:500 .65rem "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.section-head{display:block}.section-head p{margin-top:14px}}@media(max-width:620px){.hero,.section{padding-left:6vw;padding-right:6vw}.grid{grid-template-columns:1fr}.footer{flex-direction:column}.hero h1{font-size:3.7rem}}</style>

const key=new URLSearchParams(location.search).get('plan'),plan=PLANS[key];if(!plan){location.replace('./#membresias')}else{document.title=`${plan.title} | Aliados ALIGN`;document.querySelector('#title').textContent=plan.title;document.querySelector('#description').textContent=plan.description;document.querySelector('#allies').innerHTML=plan.allies.map(id=>{const ally=ALLIES[id],category=ally.type==='category';return `<article class="ally${category?' category':''}"><div><p class="eyebrow">${category?'Categoría ALIGN':'Aliado ALIGN'}</p><h3>${ally.name}</h3><p>${ally.offer}</p></div><div class="ally-footer"><span class="tag">${category?'Disponible en':'Incluido en'} ${plan.title}</span><a class="cta" href="${ally.url}?plan=${encodeURIComponent(key)}">${ally.button}</a></div></article>`}).join('')}
