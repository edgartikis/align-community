<style>:root{--paper:#f4f1eb;--ink:#090a0c;--gold:#d9c6a5;--line:rgba(255,255,255,.14)}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--paper);font-family:"DM Sans",sans-serif}a{color:inherit;text-decoration:none}.nav{display:flex;justify-content:space-between;align-items:center;padding:22px 5vw;border-bottom:1px solid var(--line)}.brand{font:500 1.25rem "Playfair Display",serif;letter-spacing:.2em}.back{font:500 .68rem "DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#bbb}.hero{padding:92px 5vw 72px;background:radial-gradient(circle at 82% 0,#24486f 0,transparent 36%),linear-gradient(145deg,#111820,#090a0c)}.eyebrow{margin:0 0 14px;font:500 .68rem "DM Mono",monospace;letter-spacing:.15em;text-transform:uppercase;color:#8d9299}h1,h2,h3{font-family:"Playfair Display",serif;font-weight:500}.hero h1{max-width:900px;margin:0;font-size:clamp(3.6rem,8vw,7.4rem);line-height:.88;letter-spacing:-.06em}.hero p:last-child{max-width:590px;margin:28px 0 0;color:#c7c9cd;line-height:1.7}.section{padding:82px 5vw;background:var(--paper);color:var(--ink)}.section-head{display:flex;justify-content:space-between;align-items:end;gap:28px;margin-bottom:35px}.section h2{margin:0;font-size:clamp(2.6rem,5vw,4.8rem);line-height:.95;letter-spacing:-.045em}.section-head p{max-width:440px;margin:0;color:#666b71;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.ally{min-height:330px;display:flex;flex-direction:column;padding:30px;border:1px solid rgba(9,10,12,.14);background:#fff;box-shadow:0 15px 45px rgba(22,24,28,.04)}.ally h3{margin:0;font-size:clamp(1.9rem,2.8vw,2.7rem);line-height:1}.ally p{margin:18px 0;color:#555b61;line-height:1.6}.ally-footer{margin-top:auto;padding-top:22px;border-top:1px solid rgba(9,10,12,.11)}.tag{display:block;margin-bottom:14px;font:500 .61rem "DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#71767d}.cta{display:inline-flex;min-height:42px;align-items:center;padding:12px 16px;border:1px solid #111;font:600 .65rem "DM Mono",monospace;letter-spacing:.09em;text-transform:uppercase}.cta:hover{background:#111;color:#fff}.footer{padding:30px 5vw;display:flex;justify-content:space-between;gap:15px;color:#777;font:500 .65rem "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.section-head{display:block}.section-head p{margin-top:14px}}@media(max-width:620px){.hero,.section{padding-left:6vw;padding-right:6vw}.grid{grid-template-columns:1fr}.footer{flex-direction:column}.hero h1{font-size:3.7rem}}</style></head>
<body><nav class="nav"><a class="brand" href="./">ALIGN</a><a class="back" href="./#membresias">← Volver</a></nav><header class="hero"><p class="eyebrow" id="kicker">Aliados de tu paquete</p><h1 id="title">Aliados seleccionados.</h1><p id="description">Explora las experiencias incluidas en esta membresía.</p></header><main class="section"><div class="section-head"><h2>Tu selección ALIGN.</h2><p>Entra a cada aliado para conocer su experiencia y sus beneficios.</p></div><div class="grid" id="allies"></div></main><footer class="footer"><span>© 2026 ALIGN Membership</span><span>Tampico · Madero · Altamira</span></footer>
<script>
const ALLIES={uspin:{name:'USPIN',offer:'Indoor cycling, energía y comunidad en cada clase.',url:'uspin.html',button:'Ver USPIN'},nuva:{name:'NUVA Pilates Studio',offer:'Movimiento, fuerza y bienestar en una experiencia diseñada para ti.',url:'nuva.html',button:'Ver NUVA'},sante:{name:'Santé Pilates',offer:'Pilates, fuerza y movimiento dentro de la selección de Girls Club.',url:'sante.html',button:'Ver Santé'},global:{name:'Global Gym',offer:'Mensualidad con 10% de descuento, primer mes sin mantenimiento, invitados al 50% y 10% en cafetería.',url:'global-gym.html',button:'Ver Global Gym'},gingers:{name:"Ginger's Coffee House",offer:'Café, brunch y momentos para compartir con beneficio 3x2 para miembros ALIGN.',url:'gingers.html',button:"Ver Ginger's"},marea:{name:'Marea Baja',offer:'Clases de surf para vivir Playa Miramar de una forma diferente.',url:'marea-baja.html',button:'Ver Marea Baja'},padel:{name:'Pádel 11:11',offer:'15% de descuento en el pago de cancha y 10% en restaurante sobre el consumo individual del miembro ALIGN.',url:'padel-11-11.html',button:'Ver Pádel 11:11'},rancho:{name:'Rancho MX',offer:'Estilo western con beneficios en productos Cuadra y Thompston seleccionados.',url:'rancho-mx.html',button:'Ver Rancho MX'},horse:{name:'Horse Riding',offer:'Paseos a caballo en La Herradura por $350 la hora para miembros.',url:'horse-riding.html',button:'Ver Horse Riding'},fishing:{name:'Vaca Fishing',offer:'Pesca, convivencia y una parada en la playa para compartir con amigos o familia.',url:'dia-de-pesca.html',button:'Ver Pesca'},charreadas:{name:'Charreadas',offer:'Acceso preferencial a la preventa con 150 boletos disponibles para miembros de Ranch Club.',url:'charreadas.html',button:'Apartar mi boleto'},velamar:{name:'Velamar · 2 departamentos',offer:'Torre Marmara, pisos 11 y 8, con capacidad máxima para 8 personas por departamento.',url:'velamar.html?v=7',button:'Ver departamentos'}};
const PLANS={brotherhood:{title:'The Brotherhood',description:'Estilo, entrenamiento, caballos, pesca y mar.',allies:['global','padel','rancho','horse','fishing','marea','velamar']},girls:{title:'Girls Club',description:'Movimiento, bienestar, café y experiencias frente al mar.',allies:['global','padel','sante','gingers','uspin','marea','nuva','velamar']},ranch:{title:'Ranch Club',description:'El universo western de ALIGN: estilo, caballos y acceso preferencial a charreadas.',allies:['global','padel','rancho','horse','charreadas','velamar']},duo:{title:'Duo Club',description:'Experiencias para compartir entre dos, con entrenamiento, café y comunidad.',allies:['global','padel','gingers','velamar']},circle:{title:'Private Circle',description:'El paquete más completo, con acceso a todos los aliados y experiencias ALIGN.',allies:['global','padel','gingers','uspin','nuva','sante','marea','rancho','horse','fishing','charreadas','velamar']}};
const key=new URLSearchParams(location.search).get('plan'),plan=PLANS[key];if(!plan){location.replace('./#membresias')}else{document.title=`${plan.title} | Aliados ALIGN`;document.querySelector('#title').textContent=plan.title;document.querySelector('#description').textContent=plan.description;document.querySelector('#allies').innerHTML=plan.allies.map(id=>{const ally=ALLIES[id];return `<article class="ally"><div><p class="eyebrow">Aliado ALIGN</p><h3>${ally.name}</h3><p>${ally.offer}</p></div><div class="ally-footer"><span class="tag">Incluido en ${plan.title}</span><a class="cta" href="${ally.url}?plan=${encodeURIComponent(key)}">${ally.button}</a></div></article>`}).join('')}
</script></body></html>
